<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Hémisphère Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Mise en page : barre d'outils, espace de travail en panneaux redimensionnables (terminal), trois colonnes (courtage), cartes de contrôle (simulation). Thème sombre unique, assumé. */
:root{
 --bg:#090b0d; --panel:#101317; --panel2:#161a20; --line:#242a32; --line2:#323a44;
 --amber:#4da3ff; --amber2:#2d6cb0; --fg:#e7e4dc; --mute:#8b939d; --dim:#5c646e;
 --up:#3fd08f; --down:#ff6161; --hdr:#14202e; --sel:#10233a; --blue:#b48cff;
 --k1:#4da3ff; --k2:#a0e4ff; --k3:#e6d36a; --k4:#ff86a4; --k5:#5fd6c9; --k6:#c49bff; --k7:#9fd36b; --c-w:#e7e4dc;
 --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace; --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
 color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--mono);font-size:13px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.up{color:var(--up)}.dn{color:var(--down)}.mute{color:var(--mute)}.am{color:var(--amber)}
.num{font-variant-numeric:tabular-nums}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0 8px;border-bottom:1px solid var(--line)}
@media (max-width:760px){.topbar{position:static}}
.brand{font-weight:600;letter-spacing:.18em;color:var(--amber);font-size:14px}
.clock{display:flex;gap:10px;align-items:baseline}
.clock .mute{font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.speed{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.speed button{background:transparent;border:0;padding:4px 9px;color:var(--mute);font-size:12px}
.speed button[aria-pressed=true]{background:var(--amber);color:#04121f;font-weight:600}
.seg{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 12px;color:var(--mute);letter-spacing:.06em;font-size:12px;text-transform:uppercase}
.seg button[aria-pressed=true]{background:var(--hdr);color:var(--amber)}
.usearch{position:relative;flex:1 1 160px;min-width:140px;max-width:420px}
.usearch input{width:100%;background:#000;border:1px solid var(--line2);color:var(--fg);padding:6px 10px;font:13px var(--mono);border-radius:3px}
.usr{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel2);border:1px solid var(--line2);z-index:20;max-height:60vh;overflow:auto;box-shadow:0 10px 30px #000a}
.usr button{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:6px 10px}
.usr button[aria-selected=true],.usr button:hover{background:var(--sel)}
.usr .k{color:var(--amber);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.usr .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eqv{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;margin-left:auto}
.eqv span:first-child{font-size:10px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase}

.tape{overflow:hidden;border-bottom:1px solid var(--line);white-space:nowrap;padding:5px 0;font-size:12px}
.tape .track{display:inline-flex;gap:28px;animation:tape 120s linear infinite;padding-left:100%}
.tape .track span b{color:var(--amber);font-weight:500;margin-right:6px}
@keyframes tape{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.tape{overflow-x:auto}.tape .track{animation:none;padding-left:0}}
.ntape{display:flex;align-items:stretch;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap;overflow:hidden}
.ntape .nlab{flex:none;display:flex;align-items:center;background:var(--down);color:#fff;font-weight:600;letter-spacing:.12em;padding:0 10px;font-size:10px;font-family:var(--mono)}
.ntape .nlab.flash{animation:nflash 1s steps(2) 6}
@keyframes nflash{50%{background:var(--fg);color:var(--bg)}}
.ntape .nwrap{flex:1;min-width:0;overflow:hidden}
.ntape .track{display:inline-flex;gap:40px;padding:6px 0 6px 100%;animation:tape 150s linear infinite}
.ntape:hover .track,.ntape:focus-within .track{animation-play-state:paused}
.ntape .ni{cursor:pointer;color:var(--fg)}.ntape .ni:hover .h{text-decoration:underline}
.ntape .ni em{font-style:normal;font-size:10px;letter-spacing:.08em;margin-right:6px;color:var(--amber)}
.ntape .ni .fl{background:var(--down);color:#fff;padding:0 5px;border-radius:2px;margin-right:6px;font-size:10px;font-weight:600}
.ntape .ni .fk{text-decoration:line-through;opacity:.6}.ntape .ni .ow{color:var(--amber);margin-right:4px}.ntape .ni .t{color:var(--mute);margin-right:6px;font-family:var(--mono)}
@media (prefers-reduced-motion:reduce){.ntape .nwrap{overflow-x:auto}.ntape .track{animation:none;padding-left:8px}}

/* Terminal */
.wsbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:10px 0 8px}
.lay{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.lay button{background:transparent;border:0;padding:4px 9px;color:var(--mute);font-size:12px}
.lay button[aria-pressed=true]{background:var(--hdr);color:var(--amber)}
.wsbar select,.wsbar input{background:var(--panel2);border:1px solid var(--line2);color:var(--fg);padding:4px 8px;font:12px var(--mono);border-radius:3px}
.sbtn{background:var(--panel2);border:1px solid var(--line2);padding:4px 9px;border-radius:3px;font-size:12px}
.fkeys{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.fkeys button{background:var(--panel2);border:1px solid var(--line);padding:3px 7px;border-radius:2px;font-size:12px}
.fkeys button b{color:var(--amber);font-weight:600;margin-right:5px}
.ws{display:flex;flex-direction:column}
.wrow{display:flex;min-height:200px}
.pane{background:var(--panel);border:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.pane.act{border-color:var(--amber2);box-shadow:inset 0 2px 0 var(--amber)}
.pcmd{display:flex;align-items:center;gap:6px;background:#000;border-bottom:1px solid var(--line2);padding:4px 8px}
.pcmd .pn{color:var(--dim);font-size:11px}
.pcmd input{flex:1;min-width:0;background:transparent;border:0;color:var(--amber);font:500 13px var(--mono);letter-spacing:.04em;text-transform:uppercase;outline:none}
.pcmd button{background:transparent;border:1px solid var(--line2);color:var(--mute);padding:1px 7px;font-size:11px;border-radius:2px}
.perr{color:var(--down);font-size:11px;padding:0 8px}
.pbody{flex:1;overflow:auto;min-height:0}
.vsplit{flex:0 0 6px;cursor:col-resize;background:transparent;position:relative;touch-action:none}
.vsplit::after,.hsplit::after{content:"";position:absolute;background:var(--line2)}
.vsplit::after{left:2px;top:0;bottom:0;width:2px}
.hsplit{height:6px;cursor:row-resize;position:relative;touch-action:none}
.hsplit::after{top:2px;left:0;right:0;height:2px}
.vsplit:hover::after,.hsplit:hover::after{background:var(--amber)}
@media (max-width:900px){.wrow{flex-direction:column;height:auto!important}.wrow .pane{flex-basis:auto!important;margin-bottom:8px}.pbody{max-height:75vh}.vsplit,.hsplit{display:none}}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;background:var(--hdr);padding:6px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
.ph .code{color:var(--amber);font-weight:600;letter-spacing:.06em}
.ph .ttl{font-weight:500}
.ph .sub{color:var(--mute);font-size:12px;margin-left:auto}
.pb{padding:10px}
.scroll{overflow-x:auto}
table.tt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tt th{color:var(--amber);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:5px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tt td{padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tt .r{text-align:right}
.tt tr[data-go]{cursor:pointer}
.tt tr[data-go]:hover td,.tt tr[data-go]:focus td,.tt tr.on td{background:var(--sel)}
.tt tr[data-go]:focus{outline:none}
.tt th[data-sort]{cursor:pointer}
.tt tr.med td{border-top:1px solid var(--line2);color:var(--amber)}
.tk{color:var(--amber);font-weight:500}
.tag{display:inline-block;font-size:10px;letter-spacing:.06em;padding:1px 5px;border:1px solid var(--line2);color:var(--mute);border-radius:2px}
.tag.user{border-color:var(--blue);color:var(--blue)}
.sp{display:block}
canvas.ch{width:100%;height:230px;display:block;cursor:crosshair;touch-action:pan-y}
canvas.ch.sm{height:160px}
canvas.ch.vb{height:60px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.box{border:1px solid var(--line);background:var(--panel2);min-width:0}
.box h4{margin:0;padding:5px 8px;font-size:11px;font-weight:500;color:var(--amber);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.box .in{padding:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:2px 16px}
.kv div{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dotted var(--line)}
.kv div span:first-child{color:var(--mute)}
.kv b{white-space:nowrap;font-weight:500}
.diag{font-family:var(--sans);font-size:14px;line-height:1.6;max-width:72ch;margin:0}
.note{font-family:var(--sans);font-size:12.5px;line-height:1.55;color:var(--mute);max-width:80ch;margin:8px 0 0}
.newsl{list-style:none;margin:0;padding:0}
.newsl li{border-bottom:1px solid var(--line);padding:6px 10px;cursor:pointer}
.newsl li:hover{background:var(--panel2)}
.newsl .meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:11px;color:var(--mute);align-items:center}
.newsl li.i3 .hd{color:#fff;font-weight:500}
.newsl li.i3 .dot{background:var(--down)}.newsl li.i2 .dot{background:var(--amber)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--dim);display:inline-block}
.newsl .body{font-family:var(--sans);font-size:13.5px;line-height:1.55;margin-top:6px;max-width:72ch}
.lks{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.lk{background:transparent;border:1px solid var(--line2);border-radius:2px;padding:1px 6px;font-size:11px}
.lk.up{border-color:#245a40}.lk.dn{border-color:#5a2424}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line)}
.chip{background:transparent;border:1px solid var(--line2);border-radius:2px;padding:2px 8px;font-size:11px;color:var(--mute)}
.chip[aria-pressed=true]{border-color:var(--amber);color:var(--amber)}
.bars{display:flex;flex-direction:column;gap:4px}
.bar{display:grid;grid-template-columns:minmax(0,1.6fr) 1fr 72px;gap:8px;align-items:center;font-size:12px}
.bar .tr{height:10px;background:var(--panel);position:relative;border:1px solid var(--line)}
.bar .tr i{position:absolute;top:0;bottom:0;display:block}
.bar .tr.c::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line2)}
.gauge{height:12px;background:linear-gradient(90deg,var(--down),var(--amber) 50%,var(--up));position:relative;border-radius:2px}
.gauge i{position:absolute;top:-4px;width:3px;height:20px;background:var(--fg)}
.help dt{color:var(--amber);font-weight:600;margin-top:8px}
.help dd{margin:2px 0 0;font-family:var(--sans)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--mute);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:5px}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid var(--line2);padding:3px 10px;font-size:12px;color:var(--mute);border-radius:2px}
.tabs button[aria-pressed=true]{color:var(--amber);border-color:var(--amber)}
.trade-btn{background:var(--amber);color:#04121f;border:0;padding:4px 12px;font-weight:600;border-radius:2px;font-size:12px}
.star{background:transparent;border:1px solid var(--line2);padding:3px 9px;border-radius:2px;font-size:12px}
.star[aria-pressed=true]{color:var(--amber);border-color:var(--amber)}
.inl>span{white-space:nowrap}
.inl input{background:#000;border:1px solid var(--line2);color:var(--fg);padding:4px 7px;font:12px var(--mono);width:90px;border-radius:2px}
.heat td{text-align:center;font-size:11px;min-width:46px}
.evl{list-style:none;margin:0;padding:0}
.evl li{border-bottom:1px solid var(--line);padding:8px 10px}
.evl .t{font-weight:500}
.evl ul{margin:4px 0 0;padding-left:18px;font-family:var(--sans);font-size:12.5px;color:var(--fg)}
.evl .ms{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;margin-top:4px}

/* Courtage */
#broker{font-family:var(--sans);font-size:14px;margin-top:12px}
#broker .num,#broker td,#broker .px{font-family:var(--mono)}
.bgrid{display:grid;grid-template-columns:290px minmax(0,1fr) 360px;gap:12px;align-items:start}
@media (max-width:1250px){.bgrid{grid-template-columns:270px minmax(0,1fr)}.bgrid .col3{grid-column:1/-1}}
@media (max-width:760px){.bgrid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0}
.card>h3{margin:0;padding:10px 14px;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line)}
.card .cb{padding:12px 14px}
.col1 .card,.col2 .card,.col3 .card{margin-bottom:12px}
.blist{max-height:640px;overflow-y:auto}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.brow:hover{background:var(--panel2)}
.brow.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--amber)}
.brow .t{font-family:var(--mono);font-weight:600}
.brow .n{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .p,.brow .c{text-align:right;font-family:var(--mono)}.brow .c{font-size:12px}
.search{width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--fg);padding:7px 10px;border-radius:4px;font:inherit}
.btabs{display:flex;gap:6px;padding:10px 14px 0}
.btabs button{flex:1;background:transparent;border:1px solid var(--line2);border-radius:4px;padding:5px;font-size:12px;color:var(--mute)}
.btabs button[aria-pressed=true]{color:var(--fg);border-color:var(--blue);background:#14223a}
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.qhead h2{margin:0;font-size:22px;font-weight:600}
.qhead .px{font-size:26px;font-weight:500}
.qhead .meta{color:var(--mute);font-size:13px;flex-basis:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px 16px;margin-top:12px}
.stats div span{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.stats div b{font-family:var(--mono);font-weight:500}
.why{font-size:14px;line-height:1.55;max-width:70ch;margin:0 0 10px}
.ticket .sidesw{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ticket .sidesw button{border:1px solid var(--line2);background:transparent;border-radius:4px;padding:8px;font-weight:600}
.ticket .sidesw button[aria-pressed=true][data-side="1"]{background:#123526;border-color:var(--up);color:var(--up)}
.ticket .sidesw button[aria-pressed=true][data-side="-1"]{background:#3a1616;border-color:var(--down);color:var(--down)}
.ticket label{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px}
.ticket select,.ticket input{width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--fg);padding:8px 10px;border-radius:4px;font:15px var(--mono)}
.ticket .row2{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:end}
.ticket .maxb{background:transparent;border:1px solid var(--line2);border-radius:4px;padding:8px 10px;font-size:12px;color:var(--mute)}
.ticket .est{margin-top:12px;font-size:13px;color:var(--mute);line-height:1.6}
.ticket .est b{color:var(--fg);font-family:var(--mono);font-weight:500}
.ticket .go{margin-top:12px;width:100%;border:0;border-radius:4px;padding:11px;font-weight:600;font-size:15px}
.ticket .go.buy{background:var(--up);color:#04170e}.ticket .go.sell{background:var(--down);color:#1d0505}
.msg{margin-top:8px;font-size:13px;min-height:1.2em}
.acct{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.acct div span{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.acct div b{font-family:var(--mono);font-weight:500;font-size:15px}
.acct .big{grid-column:1/-1}.acct .big b{font-size:24px}
#broker table.tt th{color:var(--mute);font-family:var(--sans)}
#broker table.tt td{font-size:12.5px}
.xbtn{background:transparent;border:1px solid var(--line2);color:var(--mute);border-radius:3px;padding:1px 7px;font-size:11px}
.empty{color:var(--mute);font-size:13px;padding:6px 0}

/* Simulation */
#sim{font-family:var(--sans);font-size:14px;margin-top:12px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;align-items:start}
.sgrid .wide{grid-column:1/-1}
#sim .card h3{display:flex;justify-content:space-between;align-items:center}
#sim p.d{margin:0 0 10px;color:var(--mute);font-size:13px;line-height:1.5}
#sim input[type=range]{width:100%;accent-color:var(--amber)}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.sb{background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:6px 10px;font-size:13px}
.sb.pri{background:var(--amber);color:#04121f;border-color:var(--amber);font-weight:600}
.sb.warn{border-color:var(--down);color:var(--down)}
.sb.upb{border-color:#245a40;color:var(--up)}.sb.dnb{border-color:#5a2424;color:var(--down)}
.eqv{background:none;border:1px solid transparent;border-radius:4px;padding:2px 6px;cursor:pointer;color:inherit;font:inherit}.eqv:hover,.eqv:focus-visible{border-color:var(--amber2);background:var(--sel)}
.ownb{display:inline-block;margin-left:6px;padding:0 5px;border-radius:3px;font-size:10px;font-weight:600;border:1px solid var(--amber2);background:var(--sel);color:var(--fg);white-space:nowrap;vertical-align:middle}.ownb.up{color:var(--up)}.ownb.dn{color:var(--down)}
tr.ownrow td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
.ownbar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;border:1px solid var(--amber2);background:var(--sel);border-radius:4px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.newsl .tag.held{border-color:var(--amber2);background:var(--sel);color:var(--amber)}.newsl .tag.low{color:var(--down);border-color:var(--down)}.newsl .tag.fake{background:var(--down);color:#fff;border-color:var(--down)}.newsl .hd.strike{text-decoration:line-through;text-decoration-color:var(--down);opacity:.75}

function uniq(set,v,alt){let x=v,i=0;while(set.has(x)){x=alt(i++);}set.add(x);return x;}
function genCountries(r){
 const others=['industrial','oil','emerging','tech','agri'];
 for(let i=others.length-1;i>0;i--){const j=Math.floor(r.next()*(i+1));[others[i],others[j]]=[others[j],others[i]];}
 const roles=['reserve',...others.slice(0,3+Math.floor(r.next()*2))];
 const styles=Object.keys(STY).filter(k=>k!=='sw');for(let i=styles.length-1;i>0;i--){const j=Math.floor(r.next()*(i+1));[styles[i],styles[j]]=[styles[j],styles[i]];}
 const ids=new Set(),curs=new Set(),names=new Set(),cbs=new Set();
 return roles.map((role,k)=>{
  const st=STY[styles[k]],A=ARCH[role],c={role,style:styles[k]};
  let name;do{name=capF((rp(r,st.c1)+rp(r,st.c2)).toLowerCase());}while(names.has(name));names.add(name);
  c.name=name;c.de=deN(name);
  const root=name.replace(/[aeiouy]+$/i,'').toLowerCase();c.adj=root+'ien';c.adjF=root+'ienne';
  const base=strip(name).toUpperCase().replace(/[^A-Z]/g,'');
  c.id=uniq(ids,(base+'XXX').slice(0,3),i=>base.slice(0,2)+'QWZKJ'[i%5]);
  const [cn,fm]=rp(r,st.cur).split(':');c.fem=+fm;c.curName=`${cn} ${c.fem?c.adjF:c.adj}`;c.curL=(c.fem?'la ':'le ')+c.curName;
  c.cur=uniq(curs,c.id.slice(0,2)+strip(cn)[0].toUpperCase(),i=>c.id.slice(0,2)+'XYZQ'[i%4]);
  c.cb=(role==='reserve'?'Banque fédérale ':'Banque centrale ')+c.de;
  c.cbS=uniq(cbs,(role==='reserve'?'BF':'BC')+c.id[0],()=> 'BC'+c.id);
  const city=capF((rp(r,st.r1)+rp(r,st.city)).toLowerCase());
  c.exch='Bourse '+deN(city);c.exchS=strip(city).toUpperCase().slice(0,2)+'X';
  c.src={en:`The ${city} Ledger`,de:`${city}er Wirtschaftsblatt`,ar:`${city} Financial Gazette`,es:`Diario de ${city}`,jp:`${city} Keizai`,sl:`${city} Vestnik`}[c.style];
  c.idxN={en:`${c.id} 500`,de:`${c.id} 40`,ar:`${name.toUpperCase()} 25`,es:`${c.id} GENERAL`,jp:`${name.toUpperCase()} 100`,sl:`${c.id} 50`}[c.style];
  for(const k2 in A){if(k2==='fx0')continue;c[k2]=+rr(r,A[k2][0],A[k2][1]).toFixed(4);}
  c.fx0=role==='reserve'?1:+rr(r,...(A.fx0||[1,1])).toFixed(3);
  c.gap0=+rr(r,-.6,.6).toFixed(2);c.pi=+(c.piT+rr(r,-.4,(role==='emerging'?3.5:1.2))).toFixed(2);c.g=+(c.gStar+rr(r,-.5,.5)).toFixed(2);c.u=+(c.uStar+rr(r,-.3,.8)).toFixed(2);
  c.i=Math.max(-0.25,Math.round((c.rStar+c.pi+0.5*(c.pi-c.piT)+0.5*c.gap0+rr(r,-.7,.3))*4)/4);
  c.cbOff=(5+k*7)%32;c.cpiOff=3+k*3;c.gdpOff=30+k*4;
  return c;
 });
}
function genCo(r,c,ik,usedT,usedN){
 const I=INDS[ik],st=STY[c.style];let name,root,tm;
 for(let k=0;k<20;k++){root=capF((rp(r,st.r1)+rp(r,st.r2)).toLowerCase());tm=rp(r,(I.n[c.style]||I.n.en).split('|'));name=tm.replace('%',root);if(!usedN.has(name))break;}
 usedN.add(name);
 const letters=strip(root+tm.replace('%','')).toUpperCase().replace(/[^A-Z]/g,'');
 const t=uniq(usedT,letters.slice(0,4).padEnd(4,'X'),i=>letters.slice(0,3)+'ABCDEFGHIJKLMNOPRSTUVWYZ'[(i*7+letters.length)%24]+(i>23?String(i%10):''));
 const d={t,n:name,c:c.id,ik,s:{}};
 for(const k of ['m','g','pe','dur','beta','debtR','div'])d[k]=+rr(r,I[k][0],I[k][1]).toFixed(4);
 d.sp=+rr(r,...(I.sp||[1,2.5])).toFixed(2);d.vol=+rr(r,...(I.vol||[.9,1.2])).toFixed(2);
 for(const k in I.s)d.s[k]=+rr(r,I.s[k][0],I.s[k][1]).toFixed(4);
 d.debtR=+Math.min(d.debtR,d.m/(3.5*Math.max(1,c.i+d.sp)/100)).toFixed(4);
 d.rev=Math.round(clamp(Math.exp(Math.log(c.role==='reserve'?8000:5000)+1.0*gaussR(r)),400,160000));
 d.px=+Math.max(3,Math.exp(Math.log(c.style==='jp'?2200:55)+0.75*gaussR(r))).toFixed(2);
 return d;
}
function genWorld(kind,seed){
 const r=mkRng(seed);
 const countries=kind==='classic'?CLASSIC.map(c=>({...c})):genCountries(r);
 const cos=kind==='classic'?CLASSIC_CO.map(o=>({...o,s:{...o.s}})):[];
 const usedT=new Set(cos.map(o=>o.t)),usedN=new Set(cos.map(o=>o.n));
 const tot=150,ws=countries.map(c=>Math.pow(c.size,0.55)),sw=ws.reduce((a,b)=>a+b,0);
 countries.forEach((c,i)=>{const n=(c.nco||Math.max(12,Math.round(tot*ws[i]/sw)))-cos.filter(o=>o.c===c.id).length;
  const W=ROLEW[c.role],keys=Object.keys(W),tw=keys.reduce((a,k)=>a+W[k],0);
  for(let j=0;j<n;j++){let x=r.next()*tw,ik=keys[0];for(const k of keys){x-=W[k];if(x<=0){ik=k;break;}}cos.push(genCo(r,c,ik,usedT,usedN));}});
 if(kind!=='classic'){const r2=mkRng((seed^0x9e3779b9)|0);for(const c of genFrontier(r2,countries)){countries.push(c);const n=Math.max(8,Math.round(tot*Math.pow(c.size,0.55)/sw)),W=ROLEW.frontier,keys=Object.keys(W),tw=keys.reduce((a,k)=>a+W[k],0);
  for(let j=0;j<n;j++){let x=r2.next()*tw,ik=keys[0];for(const k of keys){x-=W[k];if(x<=0){ik=k;break;}}cos.push(genCo(r2,c,ik,usedT,usedN));}}}
 return {kind,seed,countries,cos};
}

const PUB_OFF={pi:0,u:8,pmi:15,conf:4,ip:11,tb:18};
const ER_OFF=i=>20+(i*3)%40;
const CS=S=>S.cids.map(i=>S.C[i]);
const BASE=S=>S.C[S.base];
function taylor(c){return Math.max(-0.5,c.rStar+c.pub.pi+0.5*(c.pub.pi-c.piT)+0.5*c.gap);}
function expMove(c){const d=taylor(c)-c.i,mx=c.safe<-0.5?1:0.5;return Math.abs(d)<0.2?0:clamp(d*0.5,-mx,mx);}
function yT(c,W){
 const tay=taylor(c);
 const y2t=c.i+0.6*(tay-c.i)+0.1+0.25*(1-c.cred)*Math.max(0,c.pi-c.piT);
 const tp=c.tpBase+0.008*Math.max(0,c.debt-60)*(1-0.6*Math.max(0,c.safe))+c.tpShock+0.06*Math.max(0,(c.def||0)-3)+0.3*(1-c.cred)*Math.max(0,c.pi-c.piT)+0.35*c.safe*W.R;
 const y10t=c.rStar+c.pie+tp+0.3*(c.iEma-(c.rStar+c.piT));
 return [y2t,y10t];
}
function bondPx(y,cpn,n=10){y/=100;if(Math.abs(y)<1e-6)return cpn*n+100;return cpn*(1-Math.pow(1+y,-n))/y+100*Math.pow(1+y,-n);}
function bondStats(y,cpn,n=10){const Y=y/100,P=bondPx(y,cpn,n);let mac=0,cx=0;for(let t=1;t<=n;t++){const cf=cpn+(t===n?100:0),pv=cf/Math.pow(1+Y,t);mac+=t*pv;cx+=t*(t+1)*pv;}mac/=P;const mod=mac/(1+Y);return {P,mac,mod,conv:cx/(P*Math.pow(1+Y,2)),dv01:mod*P/1e4};}
function trueVal(c,k,W){if(k==='pmi')return 50+2.2*(c.g-c.gStar)+2*W.R+0.8*c.gap;return c[k];}
function consensus(c,k,W){const t=trueVal(c,k,W),p=c.pub[k];return Math.round((p+0.6*(t-p))*10)/10;}
function qLabel(t){const d=new Date(t);let q=Math.floor(d.getMonth()/3)-1,y=d.getFullYear();if(q<0){q=3;y--;}return `T${q+1} ${y}`;}
function aggregate(S){let sz=0,g=0,gap=0,gs=0;for(const c of CS(S)){sz+=c.size;g+=c.size*c.g;gap+=c.size*c.gap;gs+=c.size*c.gStar;}S.W.g=g/sz;S.W.gap=gap/sz;S.W.gStar=gs/sz;}
function kFair(S,k){
 const W=S.W,A=BASE(S);
 if(k.id==='AU'){const rr_=A.y10-A.pie;return Math.log(k.p0)-0.10*(rr_-2.0)-0.18*W.R+0.6*A.weak+k.dem;}
 return Math.log(k.p0)+0.06*k.dE*(W.g-W.gStar)+0.03*k.dE*W.gap-k.sE*k.sup+k.dem;
}
function fin(co,S,idio){
 const c=S.C[co.c],K=S.K,W=S.W,s=co.s;
 const L=id=>Math.log(K[id].p/K[id].p0),R_=id=>K[id].p/K[id].p0-1;
 const lnF=(s.gd||0)*0.03*c.gap+(s.gg||0)*0.03*W.gap+(s.rt||0)*(c.i-c.i0)+(s.oR||0)*L('OIL')+(s.gR||0)*L('GAS')+(s.cR||0)*L('CU')+(s.wR||0)*L('WHT')+(s.lR||0)*L('LI')+(s.aR||0)*L('AU')+(s.fx||0)*c.weak;
 const gE=(co.g+(s.gd||0)*0.5*(c.g-c.gStar))/100;
 const rev=co.R0*(1+gE)*Math.exp(lnF)*idio;
 const m=clamp(co.m+((c.sub&&c.sub[co.sec])||0)-(s.oC||0)*R_('OIL')-(s.gC||0)*R_('GAS')-(s.cC||0)*R_('CU')-(s.wC||0)*R_('WHT')-(s.lC||0)*R_('LI'),-0.2,0.75);
 const op=rev*m,int=co.debt*Math.max(0,c.i+(co.sp||0)+W.cs)/100,pre=op-int,tax=pre>0?pre*(c.ctax!=null?c.ctax/100:0.25):0,ni=pre-tax;

}
function pieces(co,S){
 const c=S.C[co.c],W=S.W;const fi=fin(co,S,co.idioM);
 const lE=Math.log(Math.max(fi.eps,0.15*co.eps0));
 const pY=-co.dur*(c.y10-c.y10_0),pR=0.3*W.R,pS=co.sent+(S.sec[co.sec]||0)+(c.dv?c.dv.pr:0);
 let lf=lE+Math.log(co.pe)+pY+pR+pS,pS2=pS;if(co.bk){pS2-=3;lf-=3;}
 if(co.deal&&!co.bk){const t=Math.log(co.deal.px*(1-0.02-0.3*co.deal.risk));pS2+=t-lf;lf=t;}
 return {lE,pY,pR,pS:pS2,lf,eps:fi.eps};
}
const capB=(S,o)=>o.P*o.sh/S.C[o.c].fx;

/* ===== Nouvelles & journal d'événements ===== */
function srcFor(S,o){
 if(o.src)return o.src;
 const c=S.C[o.tag]||S.C[(S.co.find(x=>x.t===o.tag)||{}).c];
 if(o.cat==='Banques centrales'&&c)return `Communiqué — ${c.cbS}`;
 if(o.cat==='Données économiques'&&c)return `Office statistique ${c.de}`;
 if(o.cat==='Résultats')return 'Fil des résultats AHP';
 if(c&&rnd()<0.6)return c.src;

}
function news(S,o){
 S.hmc=(S.hmc||0)+1;const mins=7*60+((S.hmc*37+Math.floor(rnd()*20))%(10*60));
 const hm=`${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`;
 const n={id:S.nid++,d:S.date,day:S.day,hm,imp:1,cat:'Marchés',links:[],...o};n.src=srcFor(S,n);
 S.news.unshift(n);if(S.news.length>400)S.news.length=400;return n;
}
function valOf(S,id){
 if(id==='MONDE')return S.W.gidx;
 if(id.startsWith('SEC:'))return S.SX[id.slice(4)]?S.SX[id.slice(4)].v:NaN;
 if(id.startsWith('Y2:'))return S.C[id.slice(3)].y2;
 if(id.startsWith('Y10:'))return S.C[id.slice(4)].y10;
 const co=S.co.find(o=>o.t===id);if(co)return co.P;
 if(S.K[id])return S.K[id].p;
 if(S.C[id])return S.C[id].idx;
 const cc=CS(S).find(c=>c.cur===id);if(cc)return 1/cc.fx;
 const m=/^([A-Z]{3})10A$/.exec(id);if(m&&S.C[m[1]]){const c=S.C[m[1]];return bondPx(c.y10,c.cpn);}
 return NaN;
}
function valPrev(S,id){
 const L=a=>a&&a.length?a[a.length-1]:NaN;
 if(id==='MONDE')return L(S.W.h.gidx);
 if(id.startsWith('SEC:'))return S.SX[id.slice(4)]?L(S.SX[id.slice(4)].h):NaN;
 if(id.startsWith('Y2:'))return L(S.C[id.slice(3)].h.y2);
 if(id.startsWith('Y10:'))return L(S.C[id.slice(4)].h.y10);
 const co=S.co.find(o=>o.t===id);if(co)return L(co.h);
 if(S.K[id])return L(S.K[id].h);
 if(S.C[id])return L(S.C[id].h.idx);
 const cc=CS(S).find(c=>c.cur===id);if(cc)return cc.id===S.base?NaN:1/L(cc.h.fx);
 const m=/^([A-Z]{3})10A$/.exec(id);if(m&&S.C[m[1]]){const c=S.C[m[1]];return bondPx(L(c.h.y10),c.cpn);}
 return NaN;
}
function logEvent(S,e){
 const ids=[...new Set((e.links||[]).map(l=>l.id))].slice(0,10);
 const m0={};for(const id of ids){const v=valPrev(S,id);if(Number.isFinite(v))m0[id]=v;}
 const E={id:S.eid++,d:S.date,day:S.day,mday:S.day+1,by:'sim',fx:[],links:[],...e,m0,meas:null,pending:true};
 S.evlog.unshift(E);if(S.evlog.length>150)S.evlog.length=150;return E;
}
function measureEvents(S){
 for(const e of S.evlog){if(!e.pending||S.day<e.mday)continue;
  e.pending=false;e.meas=[];
  for(const id in e.m0){const v=valOf(S,id),v0=e.m0[id];if(!Number.isFinite(v))continue;
   if(id.startsWith('Y'))e.meas.push({id,txt:`${id.replace('Y2:','2 ans ').replace('Y10:','10 ans ')} ${sg((v-v0)*100,0)} pb`,d:v-v0});
   else e.meas.push({id,txt:`${labelOf(S,id)} ${pc(v/v0-1)}`,d:v/v0-1});}
 }
}
function labelOf(S,id){if(id==='MONDE')return 'Hémisphère Monde';if(id.startsWith('SEC:'))return 'Secteur '+id.slice(4);if(S.C[id])return S.C[id].idxN;const cc=CS(S).find(c=>c.cur===id);if(cc)return cc.cur+' (devise)';if(/10A$/.test(id))return 'Oblig. '+id;return id;}
function ctx(S){
 const L=[],K=[];const add=(t,id,dir)=>{L.push(t);if(id)K.push({id,dir});};
 return {L,K,add,
  tension(a,b,v){tAdd(S,a.id,b.id,v);{const r=S.G&&S.G.t[pk(a.id,b.id)];if(r)r.b=clamp(r.b+0.25*v,5,90);}L.push(`Tension ${a.name}–${b.name} ${sg(v,0)} pts (désormais ${f(tOf(S,a.id,b.id),0)}/100)`);if(v>0)K.push({id:a.id,dir:-1},{id:b.id,dir:-1});},
  app(x){if(S.P){S.P.aS+=x;add(`Popularité du gouvernement ${sg(x,0)} pt`);}},

  taxP(c,x){c.taxP+=x;add(`Impôts des ménages ${c.de} ${sg(x,1)} pt de PIB`,c.id,-Math.sign(x));},
  dev(c,x){if(!c.dv)return;const d=devShift(c,x);add(`Indice de développement ${c.de} ${sg(d*100,0)} pt`,c.id,Math.sign(d));},
  gov(c,x){if(!c.dv)return;c.dv.gov=clamp(c.dv.gov+x,0.1,0.95);add(`Qualité des institutions ${c.de} ${x>0?'en hausse':'en baisse'}`);},
  gS(c,x){c.gStar+=x;add(`Croissance potentielle ${c.de} ${sg(x,2)} pt`,c.id,Math.sign(x));},
  uS(c,x){c.uStar+=x;add(`Chômage structurel ${c.de} ${sg(x,2)} pt`);},
  res(x){if(S.P){S.P.res=Math.max(0,S.P.res+x);add(`Réserves de change ${sg(x,1)} pt de PIB`);}},

  coS(o,x){o.sent+=x;add(`Perception de ${o.n} (${o.t}) ${pc(x,0)}`,o.t,Math.sign(x));},

function fire(S,ev,by='sim',arg){
 const x=ctx(S);const r=ev.go(S,x,arg);if(!r)return null;
 const E=logEvent(S,{type:ev.id,by,title:r.head,cat:r.cat,fx:x.L.filter(Boolean),links:x.K});
 news(S,{...r,links:x.K,ev:E.id,by});
 if(by==='sim')S.cool[ev.id]=S.day+60;
 return E;
}


/* ===== Pays en développement (tiers-monde) ===== */
const DTH=[0.15,0.3,0.45],DST=['Pays fragile','Pays en développement','Économie en décollage','Marché émergent'];
const dIdx=s=>DTH.filter(t=>s>=t).length;
const frC=S=>CS(S).filter(c=>c.dv&&notP(S,c));
function genFrontier(r,cs){const out=[],ids=new Set(cs.map(c=>c.id)),curs=new Set(cs.map(c=>c.cur)),names=new Set(cs.map(c=>c.name)),cbs=new Set(cs.map(c=>c.cbS));
 const n=1+(r.next()<0.55?1:0),k0=cs.length;
 for(let j=0;j<n;j++){const style=j===0?'sw':rp(r,['sw','es','ar','sl']),st=STY[style],A=ARCH.frontier,c={role:'frontier',style},k=k0+j;
  let name;do{name=capF((rp(r,st.c1)+rp(r,st.c2)).toLowerCase());}while(names.has(name));names.add(name);
  c.name=name;c.de=deN(name);const root=name.replace(/[aeiouy]+$/i,'').toLowerCase();c.adj=root+'ien';c.adjF=root+'ienne';
  const base=strip(name).toUpperCase().replace(/[^A-Z]/g,'');
  c.id=uniq(ids,(base+'XXX').slice(0,3),i=>base.slice(0,2)+'QWZKJV'[i%6]);
  const [cn,fm]=rp(r,st.cur).split(':');c.fem=+fm;c.curName=`${cn} ${c.fem?c.adjF:c.adj}`;c.curL=(c.fem?'la ':'le ')+c.curName;
  c.cur=uniq(curs,c.id.slice(0,2)+strip(cn)[0].toUpperCase(),i=>c.id.slice(0,2)+'XYZQW'[i%5]);
  c.cb='Banque centrale '+c.de;c.cbS=uniq(cbs,'BC'+c.id[0],()=>'BC'+c.id);
  const city=capF((rp(r,st.r1)+rp(r,st.city)).toLowerCase());
  c.exch='Bourse '+deN(city);c.exchS=(strip(city).toUpperCase().replace(/[^A-Z]/g,'')+'XX').slice(0,2)+'X';if(cs.concat(out).some(o=>o.exchS===c.exchS))c.exchS=c.id.slice(0,2)+'X';
  c.src=`${city} Times`;c.idxN=`${c.id} ALL-SHARE`;
  for(const k2 in A){if(k2==='fx0')continue;c[k2]=+rr(r,A[k2][0],A[k2][1]).toFixed(4);}
  c.fx0=+rr(r,...A.fx0).toFixed(1);c.gap0=+rr(r,-.8,.3).toFixed(2);c.pi=+(c.piT+rr(r,1,9)).toFixed(2);c.g=+(c.gStar+rr(r,-1.5,.5)).toFixed(2);c.u=+(c.uStar+rr(r,-1,2)).toFixed(2);
  c.i=Math.round((c.rStar+c.pi+0.5*(c.pi-c.piT)+rr(r,-1,0.5))*4)/4;c.cbOff=(5+k*7)%32;c.cpiOff=3+k*3;c.gdpOff=30+k*4;
  c.gov=+rr(r,0.25,0.75).toFixed(3);c.dev0=+rr(r,0.06,0.24).toFixed(3);out.push(c);}
 return out;}
function devShift(c,ds){const D=c.dv;if(!D)return 0;const s0=D.s;D.s=clamp(D.s+ds,0.02,0.7);ds=D.s-s0;
 c.tpBase=Math.max(0.6,c.tpBase-0.55*D.tp0*ds);c.cred=clamp(c.cred+0.35*ds,0.2,0.92);c.uStar=Math.max(4,c.uStar-5*ds);c.fxv=Math.max(0.003,c.fxv-0.5*D.fxv0*ds);c.safe=Math.min(0.2,c.safe+0.6*ds);c.gStar+=1.2*ds;D.pr+=0.9*ds;D.gov=clamp(D.gov+0.15*ds,0.1,0.95);return ds;}
function devLog(S,c,t){const D=c.dv;D.log.unshift({d:S.date,t});if(D.log.length>12)D.log.length=12;}
function devStage(S,c){const D=c.dv,i=dIdx(D.s);
 if(i>D.si&&D.s>=DTH[i-1]+0.01){D.si=i;D.st=DST[i];const grad=i===3&&!D.grad;if(grad)D.grad=true;
  fire(S,{id:'fr_up',go(S2,x){if(grad){x.tp(c,-0.3);x.fx(c,0.03);x.risk(0.02);D.pr+=0.05;x.add(`Valorisation des entreprises ${c.de} +5 %`,c.id,1);}
   devLog(S,c,grad?'Entrée dans les marchés émergents':`Passage au stade « ${DST[i]} »`);
   return {tag:c.id,cat:'Développement',imp:grad?3:2,head:grad?`${c.name} rejoint les marchés émergents`:i===1?`${c.name} sort de la catégorie des pays fragiles`:`${c.name} entre en phase de décollage économique`,

 else if(i<D.si&&D.s<DTH[D.si-1]-0.01){D.si=i;D.st=DST[i];
  fire(S,{id:'fr_down',go(S2,x){x.tp(c,0.2);x.fx(c,-0.02);devLog(S,c,`Recul au stade « ${DST[i]} »`);
   return {tag:c.id,cat:'Développement',imp:2,head:`${c.name} retombe au stade « ${DST[i]} »`,body:`Inflation, dette, chômage ou instabilité politique ont effacé une partie des progrès : l’indice de développement repasse sous ${f(DTH[i]*100,0)}/100. Les investisseurs étrangers se retirent et ${c.curL} faiblit.`};}},'sim');}}
function frontierStep(S){for(const c of CS(S)){const D=c.dv;if(!D)continue;
 const prog=D.prog>S.day?(D.gov>0.4?0.0004:-0.0002):0;

/* ===== Géopolitique ===== */
const pk=(a,b)=>a<b?a+'|'+b:b+'|'+a;
const tOf=(S,a,b)=>a===b||!S.G?0:(S.G.t[pk(a,b)]||{t:0}).t;
function tAdd(S,a,b,x){const r=S.G&&S.G.t[pk(a,b)];if(r)r.t=clamp(r.t+x,0,100);}

function ipoHot(S){const X=S.W.h.gidx,n=X.length,r=n>127?X[n-1]/X[n-127]-1:0;return clamp(0.5+2*r+0.3*S.W.R-(S.W.vix-18)/40,0,1);}
function ipoAnnounce(S,x,c0,ik0){const R={next:rnd},cs=CS(S).filter(c=>!S.P||c.id!==S.P.cid||true);
 const c=c0||pickW(cs,c=>Math.pow(c.size,0.6)*(c.role==='frontier'?0.5:1)*(1+Math.max(0,c.g-c.gStar)/3));
 const W=ROLEW[c.role]||ROLEW.industrial,keys=Object.keys(W).filter(k=>INDS[k]);
 const secR=k=>{const X=S.SX[INDS[k].sec];return X&&X.h.length>253?X.v/X.h[X.h.length-253]-1:0;};
 const ik=ik0&&INDS[ik0]?ik0:pickW(keys,k=>W[k]*Math.exp(2.5*secR(k)));
 const usedT=new Set(S.co.map(o=>o.t).concat((S.gone||[]).map(g=>g.t),(S.ipo||[]).map(z=>z.d.t))),usedN=new Set(S.co.map(o=>o.n).concat((S.ipo||[]).map(z=>z.d.n)));
 const d=genCo(R,c,ik,usedT,usedN);d.rev=Math.round(d.rev*(0.12+0.35*rnd()));d.g=+Math.max(d.g,5+12*rnd()).toFixed(2);d.debtR=+(d.debtR*0.5).toFixed(4);d.pe=+(d.pe*(1.05+0.4*rnd())).toFixed(2);
 const hot=ipoHot(S),dem=clamp(hot*0.7+0.3*rnd()+0.2*secR(ik),0,1),days=8+Math.floor(rnd()*12);
 const z={d,c:c.id,day:S.day+days,dem,ann:S.day};(S.ipo=S.ipo||[]).push(z);
 const est=ipoEst(S,z);z.lo=est.lo;z.hi=est.hi;z.raise=est.raise;
 return {tag:c.id,cat:'Introductions en bourse',imp:2,head:`${d.n} prépare son introduction à la ${c.exch}`,body:`${d.n} (${d.t}), ${INDS[ik].ind.toLowerCase()} ${c.de} en forte croissance (+${f(d.g,0)} % par an), veut lever environ ${fmtM(z.raise)} ${c.cur}. Fourchette de prix : ${f(z.lo,2)} à ${f(z.hi,2)} ${c.cur} par action. Première cotation dans ${days} séances. Demande des investisseurs : ${dem>0.66?'forte':dem>0.33?'moyenne':'faible'}. Vous pouvez souscrire depuis le courtage ou la fonction IPO.`};}
function ipoBuild(S,z){const c=S.C[z.c],d=z.d,I=INDS[d.ik],mi=S.co.reduce((a,o)=>Math.max(a,o.i),0)+1+((S.ipoN=(S.ipoN||0)+1)%7);
 const co={...d,sec:I.sec,ind:I.ind,s:{...d.s},i:mi,R0:d.rev*c.fx,debt:d.debtR*d.rev*c.fx,idioT:1,idioM:1,sent:0,sent0:0,mom:0,sh:1,vol:(d.vol||1)*1.2,q:[],h:[],hf:[],vh:[],a:null,er:false,ret:0};
 co.cash=0.15*co.R0;co.eq=0.6*co.R0;const fi=fin(co,S,1);co.sh=Math.max(fi.ni,0.04*co.R0)*d.pe/d.px*1.25;co.eps0=d.px/d.pe;co.adv=co.sh*(0.004+0.008*rnd());co.P=d.px;
 const p=pieces(co,S);co.pp=p;co.F=Math.exp(p.lf);co.epsF=p.eps;return co;}
function ipoEst(S,z){const co=ipoBuild(S,z),fair=co.F;return {lo:fair*0.82,hi:fair*0.95,raise:fair*0.88*co.sh*0.2,co};}
function ipoList(S,z){const c=S.C[z.c];if(!c)return;const {co}=ipoEst(S,z),fair=co.F,px=z.lo+(z.hi-z.lo)*clamp(z.dem+0.2*(ipoHot(S)-0.5),0,1),pop=(z.dem-0.4)*0.35+0.06*gauss();
 co.P=px;co.cash+=px*co.sh*0.2*0.95;const p=pieces(co,S);co.pp=p;co.F=Math.exp(p.lf);co.sent=pop;co.ipo={day:S.day,px,dem:z.dem};
 const cap=co.P*co.sh,tc=S.co.filter(o=>o.c===c.id).reduce((a,o)=>a+o.P*o.sh,0);c.cap0*=(tc+cap)/Math.max(tc,1e-9);
 const cb=cap/c.fx;if(!(co.sec in S.sec))S.sec[co.sec]=0;const X=S.SX[co.sec];if(X){const ts=S.co.filter(o=>o.sec===co.sec).reduce((a,o)=>a+capB(S,o),0);X.cap0*=(ts+cb)/Math.max(ts,1e-9);}else S.SX[co.sec]={cap0:cb,v:1000,ret:0,h:[]};
 const gc=S.co.reduce((a,o)=>a+capB(S,o),0);S.W.gcap0*=(gc+cb)/gc;
 co.h=[+px.toFixed(5)];co.hf=[+co.F.toFixed(5)];co.vh=[co.adv];S.co.push(co);

 (S.ipoLog=S.ipoLog||[]).unshift({t:co.t,n:co.n,c:c.id,day:S.day,d:S.date,px,raise:px*co.sh*0.2});if(S.ipoLog.length>40)S.ipoLog.length=40;
 news(S,{tag:co.t,cat:'Introductions en bourse',imp:2,links:[{id:co.t,dir:Math.sign(pop)||1}],head:`Introduction en bourse : ${co.n} (${co.t}) fait ses débuts à la ${c.exch} à ${f(px,2)} ${c.cur}`,body:`L’entreprise lève ${fmtM(px*co.sh*0.2)} ${c.cur} et vaut ${fmtM(cap)} ${c.cur}. ${z.dem>0.66?`La demande a été très forte : les souscripteurs n’obtiennent que ${f(alloc*100,0)} % des actions demandées et le titre devrait bondir dès la première séance.`:z.dem>0.33?'La demande a été correcte.':'La demande a été faible : le titre pourrait reculer dès ses débuts.'}`});}
function ipoStep(S){if(!S.n0)S.n0=S.co.length;
 for(const z of S.ipoLog||[]){if(z.d1==null&&S.day-z.day>=1){const o=S.co.find(q=>q.t===z.t);z.d1=o?o.P/z.px-1:NaN;}}
 const n=S.co.length+(S.ipo||[]).length,p=0.0025*(1+Math.max(0,S.W.R))*(0.5+ipoHot(S))*(n<S.n0?2:1)*(n<0.9*S.n0?2:1)*(n>1.1*S.n0?0.3:1);
 if(rnd()<p)fire(S,{id:'ipo_ann',go(S2,x){return ipoAnnounce(S,x,null,null);}},'sim');

 {id:'lith_disc',cat:'eco',lab:'Découverte d’un gisement de lithium',w:1,ok:S=>S.K.LI.sup<0.06,go(S,x){const c=CS(S).sort((a,b)=>b.li-a.li)[0];x.kSup('LI',0.05);x.dem(c,0.3);const l=S.co.filter(o=>o.ik==='li').sort((a,b)=>(b.c===c.id)-(a.c===c.id))[0];if(l)x.coF(l,0.08);S.K.LI.note='Nouveau gisement';

 {id:'heatwave',cat:'eco',lab:'Vague de chaleur',w:1,ok:()=>true,go(S,x){x.kDem('GAS',0.15);x.sec('Services publics',-0.02);S.K.GAS.note='Vague de chaleur';
  return {tag:'MONDE',cat:'Énergie',imp:1,head:'Vague de chaleur record : la demande d’électricité s’envole',body:`Le gaz naturel grimpe. Les producteurs d’électricité qui achètent du gaz voient leurs marges comprimées ; la chimie aussi.`};}},
 {id:'ev_boom',cat:'eco',lab:'Boom des véhicules électriques',w:1,ok:()=>true,go(S,x){x.kDem('LI',0.08);x.sec('Automobile',0.02);

 {id:'ai_capex',cat:'eco',lab:'Vague d’investissements technologiques',w:1.2,ok:()=>true,go(S,x){x.sec('Technologie',0.03);x.kDem('CU',0.03);const s=byIk(S,'semi')[0];if(s)x.coF(s,0.04,0.5);
  return {tag:s?s.t:'MONDE',cat:'Technologie',imp:2,head:'Les géants du nuage relèvent de 30 % leurs investissements en centres de données',body:`Les commandes de puces et de logiciels d’infrastructure vont augmenter : ${nm(byIk(S,'semi','soft'))} en profitent. La construction de centres de données soutient aussi la demande de cuivre.`};}},
 {id:'shipping',cat:'eco',lab:'Fermeture d’un détroit maritime',w:1,ok:()=>true,go(S,x){byIk(S,'ship').slice(0,4).forEach(o=>x.coF(o,0.06));x.kDem('OIL',0.02);x.infl(BASE(S),0.05);const ic=oneC(S,'industrial');if(ic)x.infl(ic,0.1);

 {id:'gold_cb',cat:'eco',lab:'Achats d’or des banques centrales',w:0.8,ok:()=>true,go(S,x){x.kDem('AU',0.05);

 {id:'rec_fear',cat:'cond',lab:'Craintes de récession',w:2,ok:S=>S.W.gap<-1||CS(S).some(c=>c.g<0.2),go(S,x){x.risk(-0.1);const c=CS(S).sort((a,b)=>a.g-b.g)[0];x.sec('Industrie',-0.02);
  return {tag:c.id,cat:'Macro',imp:2,head:`Les craintes de récession montent : ${c.name} croît de ${f(c.g,1)} % seulement`,body:`Les stratèges réduisent leur exposition aux actions cycliques (banques, automobile, transport) au profit des valeurs défensives et des obligations d’État. Les marchés commencent à anticiper des baisses de taux.`};}},
 {id:'disinfl',cat:'cond',lab:'Retour de la confiance',w:1.5,ok:S=>S.W.R<-0.15,go(S,x){x.risk(0.12);
  return {tag:'MONDE',cat:'Marchés',imp:1,head:'Les investisseurs reprennent confiance : les grands fonds rachètent des actions',body:`Après plusieurs semaines de prudence, les allocations en actions remontent. Le mouvement profite d’abord aux titres cycliques et aux devises émergentes.`};}},
 {id:'fx_interv',cat:'cond',lab:'Intervention sur le marché des changes',w:2,ok:S=>nonBase(S).some(c=>c.safe>0.3&&notP(S,c)&&c.weak-c.weakEma>0.04),go(S,x){const c=nonBase(S).filter(c=>c.safe>0.3&&notP(S,c)).sort((a,b)=>(b.weak-b.weakEma)-(a.weak-a.weakEma))[0];x.fx(c,0.025);

 /* entreprises */
 {id:'bank_scandal',cat:'corp',lab:'Scandale bancaire',w:1.2,ok:S=>byIk(S,'bank').length>0,go(S,x,o){o=o||pick(byIk(S,'bank').slice(0,8));x.coS(o,-0.14);x.coF(o,-0.08);x.sec('Finance',-0.03);x.risk(-0.06);

 {id:'tech_break',cat:'corp',lab:'Percée technologique',w:1.5,ok:S=>byIk(S,'soft','semi','hw').length>0,go(S,x,o){o=o||pick(byIk(S,'soft','semi','hw').slice(0,8));x.coS(o,0.08);x.coF(o,0.07,0.5);x.sec('Technologie',0.02);

 {id:'ceo_exit',cat:'corp',lab:'Départ du dirigeant',w:1.5,ok:()=>true,go(S,x,o){o=o||pick(S.co);x.coS(o,-0.05);

 {id:'merger',cat:'corp',lab:'Offre d’acquisition',w:1.5,ok:S=>S.co.some(c=>!c.deal&&!c.bk&&!c.dist),go(S,x,o){
  let tgt=o&&!o.deal&&!o.bk&&!isQ(S,o)?o:null;if(!tgt){const iks=Object.keys(INDS).filter(k=>S.co.filter(c=>c.ik===k&&!c.deal&&!c.bk&&!isQ(S,c)).length>=2);if(!iks.length)return null;const ik=pick(iks);tgt=pick(S.co.filter(c=>c.ik===ik&&!c.deal&&!c.bk&&!c.dist&&!isQ(S,c)));if(!tgt)return null;}
  let peers=S.co.filter(c=>c.ik===tgt.ik&&c!==tgt&&!c.deal&&!c.bk&&!isQ(S,c)&&capB(S,c)>capB(S,tgt)*0.8).sort((a,b)=>capB(S,b)-capB(S,a)).slice(0,3);if(!peers.length)peers=S.co.filter(c=>c!==tgt&&!c.deal&&!c.bk&&!isQ(S,c)&&capB(S,c)>capB(S,tgt)).sort((a,b)=>capB(S,b)-capB(S,a)).slice(0,3);const acq=peers.length?pick(peers):null;if(!acq)return null;
  return dealMake(S,x,tgt,acq);}},
 {id:'recall',cat:'corp',lab:'Rappel de produits',w:1,ok:S=>byIk(S,'auto','pharma','medtech','food').length>0,go(S,x,o){o=o||pick(byIk(S,'auto','pharma','medtech','food'));x.coF(o,-0.04);x.coS(o,-0.04);
  return {tag:o.t,cat:'Entreprises',imp:2,head:`${o.n} rappelle des produits défectueux sur plusieurs marchés`,body:`Le coût du rappel et le risque de litiges pèsent sur les bénéfices de ${o.t}. Les concurrents directs pourraient récupérer des parts de marché.`};}},
 {id:'contract',cat:'corp',lab:'Contrat majeur remporté',w:1,ok:S=>byIk(S,'aero','build','mach','rail').length>0,go(S,x,o){o=o||pick(byIk(S,'aero','build','mach','rail'));x.coF(o,0.05);x.coS(o,0.03);

 {id:'buyback',cat:'corp',lab:'Rachat d’actions',w:0.8,ok:()=>true,go(S,x,o){o=o||pick(S.co.filter(c=>c.cash>0.1*c.P*c.sh));if(!o)return null;const n=0.04;o.cash-=n*o.P*o.sh;if(o.cash<0){o.debt-=o.cash;o.cash=0;}o.sh*=1-n;x.add(`Nombre d’actions de ${o.t} −4 % (bénéfice par action relevé d’autant)`,o.t,1);x.coS(o,0.02);
  return {tag:o.t,cat:'Entreprises',imp:1,head:`${o.n} annonce un programme de rachat de 4 % de ses actions`,body:`Avec moins d’actions en circulation, le bénéfice par action augmente mécaniquement. Le programme est financé par la trésorerie${o.debt>o.R0?' et un peu de dette':''}.`};}},
 /* pays en développement */
 {id:'fr_imf',cat:'eco',lab:'Programme d’aide (pays en développement)',w:1.2,ok:S=>frC(S).some(c=>!(c.dv.prog>S.day)&&(c.debt>85||c.pi>c.piT+5||S.day-c.crisis<80)),go(S,x){const c=pick(frC(S).filter(c=>!(c.dv.prog>S.day)&&(c.debt>85||c.pi>c.piT+5||S.day-c.crisis<80)));c.dv.prog=S.day+252;x.tp(c,-0.6);x.cred(c,0.06);x.fx(c,0.03);x.fis(c,-0.4);x.conf(c,-3);x.dev(c,0.02);devLog(S,c,'Programme d’aide du FMH');
  return {tag:c.id,cat:'Développement',imp:3,head:`${c.name} obtient un programme d’aide de ${f(c.size*1000*0.04,1)} milliards du Fonds monétaire d’Hémisphère`,body:`En échange de prêts à taux réduit, le gouvernement s’engage à réduire son déficit et à renforcer l’indépendance de sa banque centrale. La prime de risque recule et ${c.curL} se redresse. L’austérité freinera la croissance à court terme ; le succès dépendra de la mise en œuvre des réformes pendant l’année qui vient.`};}},
 {id:'fr_coup',cat:'eco',lab:'Coup d’État (pays en développement)',w:0.7,ok:S=>frC(S).some(c=>c.dv.s<0.4&&c.dv.gov<0.6&&!(c.dv.coup>S.day)),go(S,x){const c=pick(frC(S).filter(c=>c.dv.s<0.4&&c.dv.gov<0.6&&!(c.dv.coup>S.day)));c.dv.coup=S.day+500;c.dv.prog=0;c.dv.junta=true;x.dev(c,-0.08);x.gov(c,-0.1);x.tp(c,1.5);x.cred(c,-0.15);x.fx(c,-0.12);x.dem(c,-1.5);x.risk(-0.03);S.co.filter(o=>o.c===c.id).forEach(o=>{o.sent-=0.1;});x.add(`Actions cotées ${c.de} : perception −10 %`,c.id,-1);devLog(S,c,'Coup d’État');
  return {tag:c.id,cat:'Politique',imp:3,head:`Coup d’État ${c.de.replace(/^de /,'au ').replace(/^d’/,'en ')} : l’armée suspend la Constitution`,body:`Les militaires ont pris le pouvoir dans la nuit. Les bailleurs suspendent leur aide, les investisseurs fuient : ${c.curL} s’effondre, la prime de risque s’envole et l’économie se contracte. Les progrès des dernières années sont menacés.`};}},
 {id:'fr_default',cat:'eco',lab:'Défaut sur la dette (pays en développement)',w:0.8,ok:S=>frC(S).some(c=>c.debt>100&&!(c.dv.def>S.day)),go(S,x){const c=pick(frC(S).filter(c=>c.debt>100&&!(c.dv.def>S.day)));c.dv.def=S.day+400;x.debt(c,-35);x.tp(c,2);x.fx(c,-0.08);x.cred(c,-0.08);x.dem(c,-1);x.dev(c,-0.05);S.co.filter(o=>o.c===c.id&&o.ik==='bank').forEach(o=>x.coF(o,-0.15));devLog(S,c,'Défaut et restructuration de la dette');
  return {tag:c.id,cat:'Obligations',imp:3,head:`${c.name} suspend le remboursement de sa dette extérieure`,body:`Incapable d’honorer ses échéances, l’État impose aux créanciers une perte d’environ un tiers : la dette publique baisse de 35 points de PIB. À court terme, c’est le choc : devise en chute, banques locales en difficulté, accès aux marchés fermé. À long terme, une dette allégée peut permettre de repartir.`};}},
 {id:'fr_relief',cat:'eco',lab:'Annulation de dette (pays en développement)',w:1,ok:S=>frC(S).some(c=>c.debt>75&&c.dv.gov>0.45&&!(c.dv.rel>S.day)),go(S,x){const c=pick(frC(S).filter(c=>c.debt>75&&c.dv.gov>0.45&&!(c.dv.rel>S.day)));c.dv.rel=S.day+500;x.debt(c,-20);x.tp(c,-0.5);x.dev(c,0.04);devLog(S,c,'Annulation partielle de la dette');
  return {tag:c.id,cat:'Développement',imp:2,head:`Les créanciers internationaux annulent une partie de la dette ${c.de}`,body:`Saluant les efforts de réforme, les créanciers effacent 20 points de PIB de dette. L’État pourra consacrer davantage de moyens à la santé, à l’éducation et aux infrastructures.`};}},
 {id:'fr_reform',cat:'eco',lab:'Réforme de l’État (pays en développement)',w:0.9,ok:S=>frC(S).length>0,go(S,x){const c=pick(frC(S)),j=c.dv.junta;c.dv.junta=false;x.gov(c,0.08);x.cred(c,0.05);x.tp(c,-0.3);x.dev(c,0.03);x.conf(c,2);devLog(S,c,j?'Retour d’un gouvernement civil':'Plan anticorruption');
  return {tag:c.id,cat:'Politique',imp:2,head:j?`${c.name} : retour d’un gouvernement civil après des élections libres`:`${c.name} lance un plan de lutte contre la corruption et de réforme de l’État`,body:`${j?'Les militaires rendent le pouvoir. ':''}Administration fiscale modernisée, marchés publics transparents, justice plus indépendante : les investisseurs saluent l’annonce. Reste à voir si les réformes tiendront dans la durée.`};}},
 {id:'fr_famine',cat:'eco',lab:'Crise alimentaire (pays en développement)',w:0.7,ok:S=>frC(S).length>0,go(S,x){const c=pick(frC(S));x.dem(c,-1);x.infl(c,1.5);x.fx(c,-0.04);x.dev(c,-0.04);x.conf(c,-5);x.kSup('WHT',-0.02);devLog(S,c,'Sécheresse et crise alimentaire');
  return {tag:c.id,cat:'Agriculture',imp:3,head:`Sécheresse et crise alimentaire ${c.de.replace(/^de /,'au ').replace(/^d’/,'en ')}`,body:`Les récoltes s’effondrent et les prix alimentaires flambent. L’inflation grimpe, la consommation chute et l’État doit importer des céréales en urgence, ce qui pèse sur ${c.curL}.`};}},
 {id:'fr_fdi',cat:'eco',lab:'Investissement étranger record (pays en développement)',w:0.8,ok:S=>frC(S).length>0,go(S,x){const c=pick(frC(S));x.dev(c,0.05);x.gS(c,0.3);x.dem(c,0.6);x.fx(c,0.02);const o=S.co.filter(o=>o.c===c.id).sort((a,b)=>capB(S,b)-capB(S,a))[0];if(o)x.coF(o,0.1);devLog(S,c,'Investissement étranger record');

 {id:'fr_hyper',cat:'cond',lab:'Inflation hors de contrôle',w:3,ok:S=>frC(S).some(c=>c.pi>c.piT+10&&!(c.dv.hyp>S.day)),go(S,x){const c=frC(S).filter(c=>c.pi>c.piT+10&&!(c.dv.hyp>S.day)).sort((a,b)=>b.pi-a.pi)[0];c.dv.hyp=S.day+250;x.cred(c,-0.1);x.fx(c,-0.15);x.infl(c,3);x.dev(c,-0.05);x.conf(c,-6);devLog(S,c,'Inflation hors de contrôle');

 /* géopolitique */
 {id:'geo_incident',cat:'geo',lab:'Incident diplomatique ou frontalier',w:1.8,ok:S=>!!S.G&&geoPairs(S,(a,b)=>!atWar(S,a.id,b.id)).length>0,go(S,x){const [a,b]=pickW(geoPairs(S,(a,b)=>!atWar(S,a.id,b.id)),p=>tOf(S,p[0].id,p[1].id)+10),v=10+10*rnd(),ty=Math.floor(rnd()*4);x.tension(a,b,v);x.risk(-0.02);
  if(ty===3){S.co.filter(o=>o.c===b.id&&['bank','telco'].includes(o.ik)).slice(0,3).forEach(o=>x.coF(o,-0.02));}
  const H=[`Incident frontalier entre ${a.name} et ${b.name} : des tirs échangés, aucun mort`,`Accrochage naval entre ${a.name} et ${b.name} dans des eaux disputées`,`${a.name} expulse plusieurs diplomates ${b.adjF?b.adjF.replace(/nne$/,'ns').replace(/e$/,'s'):'étrangers'}`,`Cyberattaque contre les banques ${b.de} : ${a.name} soupçonné`];
  return {tag:a.id,cat:'Géopolitique',imp:2,head:H[ty],body:`La tension entre les deux pays monte d’un cran. Au-delà d’un certain seuil, elle freine leurs échanges commerciaux : leurs exportateurs en souffrent en premier, et l’incertitude pèse sur l’appétit pour le risque.`};}},
 {id:'geo_spy',cat:'geo',lab:'Scandale d’espionnage',w:0.6,ok:S=>!!S.G&&CS(S).length>1,go(S,x){const [a,b]=pickW(geoPairs(S,()=>true),p=>tOf(S,p[0].id,p[1].id)+20);x.tension(a,b,12);x.risk(-0.01);
  return {tag:b.id,cat:'Scandale',imp:2,head:`Scandale d’espionnage : un réseau ${a.adj||'étranger'} démantelé ${b.de.replace(/^de /,'au ').replace(/^du /,'au ').replace(/^des /,'aux ').replace(/^d’/,'en ')}`,body:`Des fonctionnaires auraient transmis des secrets industriels et militaires. ${b.name} convoque l’ambassadeur ${a.de} ; les relations entre les deux pays se dégradent.`};}},
 {id:'geo_sanc',cat:'geo',lab:'Sanctions économiques',w:1,ok:S=>!!S.G&&geoPairs(S,(a,b,t)=>t>62&&!sanc(S,a.id,b.id)&&!atWar(S,a.id,b.id)&&!allied(S,a.id,b.id)).length>0,go(S,x){const [a,b]=pickW(geoPairs(S,(a,b,t)=>t>62&&!sanc(S,a.id,b.id)&&!atWar(S,a.id,b.id)&&!allied(S,a.id,b.id)),p=>tOf(S,p[0].id,p[1].id));const by=a.size>=b.size?a:b,tg=by===a?b:a,br=geoSanction(S,x,by,tg);
  return {tag:tg.id,cat:'Géopolitique',imp:3,head:`${by.name} impose des sanctions économiques ${tg.de.replace(/^de |^du |^des |^d’/,'à ').replace(/^à /,'à ')}`.replace('à Îles','aux Îles'),body:`Gel d’avoirs, restrictions d’exportation et exclusion de certaines banques : l’économie ${tg.de} perd un débouché majeur, ${tg.curL} recule et ses entreprises cotées sont pénalisées. Les exportateurs ${by.de} perdent aussi des clients.${br.length?` ${br.length} partenariat${br.length>1?'s':''} entre entreprises des deux pays doi${br.length>1?'vent':'t'} être rompu${br.length>1?'s':''}.`:''}`};}},

  {lab:'Durcir les règles de crédit',d:'Demande −0,35 pt, banques et foncières pénalisées, popularité −2 ; la bulle est désamorcée.',go(S,x){x.dem(c,-0.35);domCo(S,c,'bank','reit','build').forEach(o=>{o.sent-=0.04;});x.add(`Banques, foncières et construction ${c.de} : perception −4 %`,c.id,-1);x.app(-2);return GN(c,2,`${c.name} durcit les règles du crédit immobilier`,`Apport minimal relevé et durée des prêts plafonnée : le marché devrait se calmer.`,'Immobilier');}},
  {lab:'Laisser courir',d:'Demande +0,3 pt maintenant ; risque d’éclatement de la bulle dans quelques mois.',go(S,x){x.dem(c,0.3);x.app(1);P.bubble=S.day+100+Math.floor(rnd()*150);return GN(c,1,`${c.name} : le gouvernement juge la hausse de l’immobilier « saine »`,`Aucune mesure n’est prise. Les ménages propriétaires se sentent plus riches et consomment davantage.`,'Immobilier');}}]})},
 {id:'trade',arg:(S,c)=>pick(CS(S).filter(o=>o.id!==c.id)).id,mk(S,c,P,pid){const p=S.C[pid];return {head:`${p.name} propose un accord de libre-échange à ${c.name}`,body:`L’accord supprimerait la plupart des droits de douane entre les deux pays. Les exportateurs y sont favorables ; les agriculteurs et certains industriels craignent la concurrence.`,def:1,opts:[
  {lab:'Signer l’accord',d:'Ouverture +5 pts, demande +0,35 pt, exportateurs gagnants, agro-industrie perdante ; popularité −1.',go(S,x){c.exp=Math.min(0.75,c.exp+0.05);x.dem(c,0.35);x.dem(p,0.1);domCo(S,c).filter(o=>(o.s.gg||0)>1).forEach(o=>{o.sent+=0.03;});domCo(S,c,'agri','food').forEach(o=>{o.sent-=0.03;});x.add(`Exportateurs ${c.de} +3 %, agro-industrie −3 %`,c.id,1);x.app(-1);return GN(c,2,`${c.name} et ${p.name} signent un accord de libre-échange`,`Les exportateurs gagnent un débouché ; les secteurs protégés devront s’adapter.`,'Commerce');}},
  {lab:'Refuser',d:'Statu quo ; popularité +1 auprès des secteurs protégés.',go(S,x){x.app(1);return GN(c,1,`${c.name} rejette l’accord proposé par ${p.name}`,`Le gouvernement invoque la protection des agriculteurs et de l’industrie locale.`,'Commerce');}}]};}},
 {id:'disaster',ok:()=>true,open(S,c){c.dem-=0.6;},mk:(S,c)=>({head:`Inondations historiques ${c.de}`,body:`Des régions entières sont sinistrées ; plusieurs usines et entrepôts sont à l’arrêt. La population attend une réponse de l’État.`,def:2,opts:[
  {lab:'Plan de reconstruction massif',d:'Relance +0,7 pt, dette +2 pts, popularité +5.',go(S,x){x.fis(c,0.7);x.debt(c,2);x.app(5);x.kDem('CU',0.01);domCo(S,c,'build').forEach(o=>x.coF(o,0.04));return GN(c,2,`${c.name} débloque un plan de reconstruction`,`Les entreprises de construction en profitent ; le déficit se creuse temporairement.`);}},
  {lab:'Aide ciblée aux sinistrés',d:'Relance +0,25 pt, dette +0,7 pt, popularité +1.',go(S,x){x.fis(c,0.25);x.debt(c,0.7);x.app(1);return GN(c,1,`${c.name} annonce une aide ciblée aux sinistrés`,`Une réponse mesurée qui ménage les finances publiques.`);}},
  {lab:'Laisser les assureurs gérer',d:'Aucun coût public ; popularité −8, demande −0,3 pt.',go(S,x){x.app(-8);x.dem(c,-0.3);domCo(S,c,'insur').forEach(o=>x.coF(o,-0.05));return GN(c,2,`${c.name} : colère après le refus d’un plan d’aide`,`Le gouvernement renvoie les sinistrés vers les assureurs, dont les bénéfices vont souffrir.`);}}]})},
 {id:'austerity',ok:(S,c)=>c.debt>85||c.def>5,mk:(S,c)=>({head:`L’agence Halvorsen menace d’abaisser la note ${c.de}`,body:`Dette : ${f(c.debt,0)} % du PIB, déficit : ${f(c.def,1)} %. L’agence attend un plan crédible de redressement des finances publiques.`,def:2,opts:[
  {lab:'Plan d’économies',d:'Dépenses −1,5 pt, croissance freinée, prime de risque −30 pb, popularité −6.',go(S,x){x.spend(c,-1.5);x.fis(c,-0.6);x.tp(c,-0.3);x.app(-6);return GN(c,2,`${c.name} présente un plan d’économies`,`Les créanciers sont rassurés et les taux longs reculent, mais l’activité ralentira.`,'Budget');}},
  {lab:'Hausse d’impôts',d:'Impôts +1 pt, croissance freinée, prime de risque −25 pb, popularité −5.',go(S,x){x.taxP(c,1);x.fis(c,-0.4);x.tp(c,-0.25);x.app(-5);return GN(c,2,`${c.name} relève les impôts pour réduire le déficit`,`Les recettes augmentent ; la consommation des ménages en pâtira.`,'Budget');}},
  {lab:'Ignorer l’avertissement',d:'La note est abaissée : prime de risque +45 pb, crédibilité en baisse.',go(S,x){x.tp(c,0.45);x.cred(c,-0.03);x.fx(c,-0.01);return GN(c,3,`L’agence Halvorsen abaisse la note souveraine ${c.de}`,`Faute de plan de redressement, les investisseurs exigent des rendements plus élevés : la dette coûte plus cher à financer.`,'Obligations');}}]})},
 {id:'champion',arg:(S,c)=>{const o=domCo(S,c,'soft','semi','hw','auto','aero','pharma','medtech')[0];return o?o.t:null;},mk(S,c,P,t){const o=coBy(t);return {head:`${o.n} menace de délocaliser sa recherche`,body:`Le champion national (${o.ind.toLowerCase()}) réclame un soutien public pour rester compétitif face à la concurrence étrangère.`,def:1,opts:[
  {lab:'Accorder un crédit d’impôt',d:'Dette +0,6 pt ; bénéfices de l’entreprise +8 %, potentiel +0,05 pt.',go(S,x){x.debt(c,0.6);x.coF(o,0.08);x.coS(o,0.05);x.gS(c,0.05);x.app(1);return GN(c,2,`${c.name} accorde un crédit d’impôt à ${o.n}`,`L’entreprise maintient ses centres de recherche sur place ; ses bénéfices attendus augmentent.`,'Entreprises');}},
  {lab:'Refuser',d:'Aucun coût ; le titre recule.',go(S,x){x.coS(o,-0.04);return GN(c,1,`${c.name} refuse d’aider ${o.n}`,`Le gouvernement refuse tout traitement de faveur ; le titre ${o.t} recule.`,'Entreprises');}},
  {lab:'Entrer au capital (10 %)',d:'Dette +1 pt ; soutien durable mais influence de l’État contestée.',go(S,x){x.debt(c,1);x.coS(o,0.03);x.coF(o,0.05);return GN(c,2,`L’État ${c.de} entre au capital de ${o.n}`,`La participation stabilise l’actionnariat ; certains investisseurs craignent une ingérence politique.`,'Entreprises');}}]};}},
 {id:'minwage',ok:()=>true,mk:(S,c)=>({head:`${c.name} : pétition géante pour une hausse du salaire minimum`,body:`Avec une inflation à ${f(c.pi,1)} %, les syndicats réclament 8 % de hausse. Le patronat met en garde contre l’effet sur l’emploi.`,def:2,opts:[
  {lab:'Hausse de 8 %',d:'Popularité +5, inflation +0,2 pt, chômage structurel +0,15 pt, marges de la distribution en baisse.',go(S,x){x.app(5);x.infl(c,0.2);x.uS(c,0.15);domCo(S,c,'retail','food').forEach(o=>x.coF(o,-0.03));return GN(c,2,`${c.name} relève le salaire minimum de 8 %`,`Le pouvoir d’achat des bas salaires augmente ; la distribution et l’agroalimentaire voient leurs coûts grimper.`);}},
  {lab:'Hausse modeste de 3 %',d:'Popularité +2, inflation +0,07 pt.',go(S,x){x.app(2);x.infl(c,0.07);return GN(c,1,`${c.name} relève le salaire minimum de 3 %`,`Une hausse alignée sur l’inflation.`);}},
  {lab:'Statu quo',d:'Popularité −3.',go(S,x){x.app(-3);return GN(c,1,`${c.name} refuse de relever le salaire minimum`,`Le gouvernement invoque la compétitivité des entreprises.`);}}]})},
 {id:'energy',ok:(S,c)=>c.oil<0&&S.K.OIL.p>S.K.OIL.p0*1.15,mk:(S,c)=>({head:`${c.name} : les factures d’énergie explosent`,body:`Le brut à ${f(S.K.OIL.p,0)} ${S.bcur} fait grimper les prix à la pompe et du chauffage. Les ménages réclament de l’aide.`,def:2,opts:[
  {lab:'Bouclier tarifaire',d:'Dépenses +0,9 pt pendant 252 séances, inflation −0,4 pt, popularité +4.',go(S,x){x.prog(c,{lab:'Bouclier tarifaire',sp:0.9,dur:252});x.infl(c,-0.4);x.app(4);return GN(c,2,`${c.name} gèle les prix de l’énergie`,`L’État compense l’écart : l’inflation mesurée recule, mais le déficit se creuse.`);}},
  {lab:'Chèques énergie ciblés',d:'Dépenses +0,35 pt pendant 189 séances, popularité +2.',go(S,x){x.prog(c,{lab:'Chèques énergie',sp:0.35,dur:189});x.app(2);return GN(c,1,`${c.name} verse des chèques énergie aux ménages modestes`,`Une aide ciblée qui limite le coût budgétaire.`);}},
  {lab:'Ne rien faire',d:'Popularité −5, confiance des ménages en baisse.',go(S,x){x.app(-5);x.conf(c,-3);return GN(c,1,`${c.name} : pas d’aide face à la flambée de l’énergie`,`Les ménages réduisent leurs autres dépenses.`);}}]})},

 {id:'ally_offer',ok:(S,c)=>!!S.G&&CS(S).some(o=>o!==c&&tOf(S,c.id,o.id)<40&&!allied(S,c.id,o.id)&&!atWar(S,c.id,o.id)),arg:(S,c)=>{const l=CS(S).filter(o=>o!==c&&tOf(S,c.id,o.id)<40&&!allied(S,c.id,o.id)&&!atWar(S,c.id,o.id));return l.length?pickW(l,o=>o.size).id:null;},mk(S,c,P,pid){const p=S.C[pid];return {head:`${p.name} propose une alliance économique et de défense à ${c.name}`,body:`L’accord réduirait les barrières commerciales entre les deux pays et prévoit une assistance mutuelle en cas d’agression. Relation actuelle : ${relLab(S,c.id,p.id).toLowerCase()} (tension ${f(tOf(S,c.id,p.id),0)}/100). Les rivaux ${p.de} pourraient le prendre mal.`,def:2,opts:[
  {lab:'Signer l’alliance',d:'Tension −10, échanges facilités (demande +0,2 pt), soutien en cas de guerre.',go(S,x){geoAlly(S,x,c,p);x.app(1);return GN(c,2,`${c.name} et ${p.name} signent une alliance`,`Les deux gouvernements s’engagent à commercer davantage et à se défendre mutuellement.`,'Géopolitique');}},
  {lab:'Négocier de meilleures conditions',d:'60 % de chances d’obtenir en plus l’ouverture du marché '+p.de+' (demande +0,3 pt) ; sinon, l’offre est retirée et la tension monte.',go(S,x){if(rnd()<0.6){geoAlly(S,x,c,p);x.dem(c,0.3);x.app(3);return GN(c,2,`${c.name} obtient de meilleures conditions et signe une alliance avec ${p.name}`,`Après d’âpres négociations, ${p.name} accepte d’ouvrir davantage son marché aux entreprises ${c.de}.`,'Géopolitique');}
   x.tension(c,p,8);x.app(-1);return GN(c,1,`${p.name} retire son offre d’alliance, vexé par les exigences ${c.de}`,`Les négociations ont échoué ; les relations entre les deux pays se refroidissent.`,'Géopolitique');}},
  {lab:'Décliner poliment',d:'Statu quo ; légère hausse de la tension (+4).',go(S,x){x.tension(c,p,4);return GN(c,1,`${c.name} décline l’offre d’alliance de ${p.name}`,`Le gouvernement préfère garder sa liberté diplomatique.`,'Géopolitique');}}]};}},
 {id:'ultimatum',ok:(S,c)=>!!S.G&&CS(S).some(o=>o!==c&&o.size>c.size*0.8&&tOf(S,c.id,o.id)>58&&!atWar(S,c.id,o.id)),arg:(S,c)=>{const l=CS(S).filter(o=>o!==c&&o.size>c.size*0.8&&tOf(S,c.id,o.id)>58&&!atWar(S,c.id,o.id));return l.length?l.sort((a,b)=>tOf(S,c.id,b.id)-tOf(S,c.id,a.id))[0].id:null;},mk(S,c,P,pid){const p=S.C[pid],n=alliesOf(S,c.id).length;return {head:`${p.name} adresse un ultimatum à ${c.name}`,body:`Le gouvernement ${p.de} exige la levée de vos barrières commerciales et le retrait de vos troupes de la frontière commune. Tension : ${f(tOf(S,c.id,p.id),0)}/100 ; au-delà de 78, une guerre devient possible. Vous avez ${n} allié${n>1?'s':''}.`,def:1,opts:[
  {lab:'Céder aux exigences',d:'Tension −18 ; vos entreprises exposées à la concurrence perdent 2 % de bénéfices ; popularité −6.',go(S,x){x.tension(c,p,-18);x.app(-6);domCo(S,c).slice(0,4).forEach(o=>x.coF(o,-0.02));return GN(c,2,`${c.name} cède à l’ultimatum ${p.de}`,`Le gouvernement accepte les exigences pour éviter l’escalade. L’opposition dénonce une humiliation.`,'Géopolitique');}},
  {lab:'Résister',d:'Tension +12, appétit pour le risque en baisse ; popularité +3. Le risque de guerre augmente.',go(S,x){x.tension(c,p,12);x.risk(-0.02);x.app(3);return GN(c,2,`${c.name} rejette l’ultimatum ${p.de}`,`Le gouvernement refuse de céder. Les investisseurs redoutent une escalade militaire.`,'Géopolitique');}},
  {lab:'Appeler vos alliés',d:n?`Vos ${n} allié${n>1?'s':''} font pression sur ${p.name} : bonne chance de désescalade (tension −10 à −20).`:'Vous n’avez aucun allié : l’appel risque de rester sans réponse (popularité −2).',go(S,x){const al=alliesOf(S,c.id).map(i=>S.C[i]);if(al.length&&rnd()<0.45+0.2*al.length){al.forEach(a=>x.tension(a,p,8));x.tension(c,p,-(10+10*rnd()));x.app(2);return GN(c,2,`Sous la pression des alliés ${c.de}, ${p.name} retire son ultimatum`,`${al.map(a=>a.name).join(' et ')} ont menacé ${p.name} de sanctions. La crise est désamorcée.`,'Géopolitique');}
   x.tension(c,p,8);x.app(-2);return GN(c,2,`${c.name} cherche des soutiens face à ${p.name}, sans succès`,`Personne ne veut s’impliquer. La tension continue de monter.`,'Géopolitique');}}]};}},
 {id:'betrayed',ok:()=>false,mk(S,c,P,bid){const b=S.C[bid];return {head:`Trahison : ${b.name} rompt son alliance avec ${c.name}`,body:`Votre ancien allié a quitté l’alliance sans préavis. Les échanges entre les deux pays vont se contracter et vous ne pourrez plus compter sur son soutien militaire.`,def:2,opts:[
  {lab:'Sanctions de représailles',d:`Sanctions contre ${b.name} : ses entreprises perdent 5 % de valorisation, mais vos exportateurs perdent aussi un client. Popularité +3.`,go(S,x){if(!sanc(S,c.id,b.id))geoSanction(S,x,c,b);x.app(3);return GN(c,3,`${c.name} sanctionne ${b.name} après sa trahison`,`Gel d’avoirs et restrictions commerciales : la riposte ${c.de} est sévère.`,'Géopolitique');}},
  {lab:'Chercher un nouvel allié',d:'Proposer une alliance au pays avec lequel vos relations sont les meilleures.',go(S,x){const q=CS(S).filter(o=>o!==c&&o!==b&&!allied(S,c.id,o.id)&&!atWar(S,c.id,o.id)).sort((u,v)=>tOf(S,c.id,u.id)-tOf(S,c.id,v.id))[0];
   if(q&&tOf(S,c.id,q.id)<55){geoAlly(S,x,c,q);x.app(2);return GN(c,2,`${c.name} se tourne vers ${q.name} et signe une nouvelle alliance`,`Après la trahison ${b.de}, le gouvernement rebâtit rapidement ses soutiens.`,'Géopolitique');}
   x.app(-1);return GN(c,1,`${c.name} cherche un nouvel allié, sans succès pour l’instant`,`Aucun pays n’est prêt à s’engager.`,'Géopolitique');}},
  {lab:'Ne rien faire',d:'Tension −10 avec '+b.name+' ; popularité −3.',go(S,x){x.tension(c,b,-10);x.app(-3);return GN(c,1,`${c.name} prend acte de la décision ${b.de}`,`Le gouvernement refuse l’escalade.`,'Géopolitique');}}]};}},
 {id:'invaded',ok:()=>false,mk(S,c,P,aid){const a=S.C[aid],al=alliesOf(S,c.id).map(i=>S.C[i]);return {head:`${a.name} envahit ${c.name}`,body:`Les troupes ${a.de} ont franchi la frontière. Chaque séance de guerre pèse sur votre économie, votre devise et votre prime de risque. Si l’occupation atteint 60 % du territoire disputé, ${a.name} annexera une partie du pays.${al.length?` Vos alliés : ${al.map(o=>o.name).join(', ')}.`:' Vous n’avez aucun allié.'}`,def:0,opts:[
  {lab:'Mobilisation générale',d:'Dépenses militaires +2 pts de PIB pendant 252 séances : vos troupes reprennent du terrain plus vite. Popularité +6.',go(S,x){const w=inWar(S,c.id);if(w)w.mob=1;x.prog(c,{lab:'Mobilisation générale',sp:2,dur:252});x.app(6);S.co.filter(o=>o.c===c.id&&['aero','steel','mach'].includes(o.ik)).forEach(o=>x.coF(o,0.06));return GN(c,3,`${c.name} décrète la mobilisation générale face à ${a.name}`,`Le pays bascule en économie de guerre. Les industriels de la défense ${c.de} tournent à plein régime.`,'Géopolitique');}},
  {lab:'Appeler les alliés à l’aide',d:al.length?`${al.length} allié${al.length>1?'s':''} sanctionne${al.length>1?'nt':''} ${a.name} et vous aide${al.length>1?'nt':''} militairement.`:'Sans allié, l’appel n’a qu’une chance sur trois d’aboutir.',go(S,x){const w=inWar(S,c.id);let ok=al;if(!al.length){const q=CS(S).filter(o=>o!==c&&o!==a).sort((u,v)=>tOf(S,c.id,u.id)-tOf(S,c.id,v.id))[0];if(q&&rnd()<0.35){geoAlly(S,x,c,q);ok=[q];}else ok=[];}
   ok.forEach(o=>{x.tension(o,a,20);if(!sanc(S,o.id,a.id))geoSanction(S,x,o,a);});if(w)w.occ=Math.max(0,w.occ-4*ok.length);x.app(ok.length?3:-2);
   return ok.length?GN(c,3,`${ok.map(o=>o.name).join(' et ')} vole${ok.length>1?'nt':''} au secours de ${c.name}`,`Sanctions contre ${a.name}, livraisons d’armes et renseignement : la pression monte sur l’agresseur.`,'Géopolitique'):GN(c,2,`L’appel à l’aide ${c.de} reste sans réponse`,`Aucun pays ne veut entrer en conflit avec ${a.name}.`,'Géopolitique');}},
  {lab:'Négocier un cessez-le-feu',d:'Les combats s’arrêtent rapidement, mais le territoire déjà occupé reste sous contrôle '+a.de+'. Popularité −8.',go(S,x){const w=inWar(S,c.id);if(w)w.forceEnd='truce';x.app(-8);return GN(c,3,`${c.name} demande un cessez-le-feu à ${a.name}`,`Le gouvernement privilégie l’arrêt des combats, quitte à céder du terrain. Les marchés saluent la décision.`,'Géopolitique');}}]};}},
 {id:'counter',ok:()=>false,mk(S,c,P,pid){const p=S.C[pid];return {head:`${p.name} pose ses conditions pour une alliance avec ${c.name}`,body:`Le gouvernement ${p.de} n’a pas accepté votre proposition telle quelle. Il fait une contre-offre.`,def:2,opts:[
  {lab:'Ouvrir votre marché',d:'Alliance signée ; vos entreprises locales perdent 3 % de bénéfices face à la concurrence ; popularité −2.',go(S,x){geoAlly(S,x,c,p);domCo(S,c).slice(0,4).forEach(o=>x.coF(o,-0.03));x.app(-2);return GN(c,2,`${c.name} ouvre son marché et obtient une alliance avec ${p.name}`,`Le prix de l’alliance : moins de protection pour l’industrie locale.`,'Géopolitique');}},
  {lab:'Verser une aide de 0,5 pt de PIB',d:'Alliance signée ; dette +0,5 pt de PIB ; popularité −1.',go(S,x){geoAlly(S,x,c,p);x.debt(c,0.5);x.app(-1);return GN(c,2,`${c.name} accorde une aide financière à ${p.name} et scelle une alliance`,`Un chèque important pour sceller le rapprochement.`,'Géopolitique');}},
  {lab:'Refuser',d:'Pas d’alliance ; tension +5.',go(S,x){x.tension(c,p,5);return GN(c,1,`${c.name} refuse les conditions ${p.de}`,`Les négociations d’alliance sont rompues.`,'Géopolitique');}}]};}},
 {id:'scandal',ok:()=>false,mk(S,c,P){return {head:`${c.name} : un ministre soupçonné de corruption`,body:`Des journalistes affirment que des contrats publics ont été attribués à des proches du ministre de l’Industrie contre des commissions. L’opposition réclame sa démission ; les investisseurs surveillent la réaction du gouvernement.`,def:2,opts:[

function leadRate(S,mv,guid,timeout){const P=S.P;if(!P)return;const c=S.C[P.cid],exp=P.meet?P.meet.exp:expMove(c);P.meet=null;

 else if(mv>0&&gap>0.5)c.cred=clamp(c.cred+0.015,0.25,0.95);

function leadBudget(S,sp,tx,ct){const P=S.P,c=S.C[P.cid];sp=clamp(sp,10,65);tx=clamp(tx,5,60);ct=clamp(ct,0,60);

 return fire(S,{id:'budget',go(S2,x){
  const eps=-(dC/100)/(1-c.ctax/100);

function election(S){const P=S.P,c=S.C[P.cid];P.nextEl=S.day+504;

function leadStep(S){
 const P=S.P;if(!P)return;const c=S.C[P.cid];
 let extra=0;
 P.progs=P.progs.filter(g=>{if(S.day>=g.end){if(g.sub)for(const s in g.sub)c.sub[s]=(c.sub[s]||0)-g.sub[s];return false;}extra+=g.sp||0;if(g.gs)c.gStar+=g.gs/g.dur;if(g.us)c.uStar+=g.us/g.dur;return true;});
 c.rAvg+=0.004*((0.7*c.y10+0.3*c.i)-c.rAvg);
 const rec=c.taxP*(1+0.004*c.gap)+0.12*c.ctax*(1+0.015*c.gap)+(P.tariff?0.3:0);
 const sp=c.spend+extra+0.25*Math.max(0,c.u-c.uStar0);
 c.def=sp+c.debt*c.rAvg/100-rec;
 c.debt=Math.max(0,c.debt+(c.def-(c.g+c.pi)/100*c.debt)/252);
 if(P.warm)return;
 const tA=52-3*(c.u-c.uStar0)-2.4*Math.max(0,c.pi-c.piT-0.5)-1.2*Math.max(0,c.piT-1-c.pi)+1.4*(c.g-c.gStar)+0.15*(c.conf-100)-0.6*Math.max(0,c.def-5)+P.aS;
 P.app=clamp(P.app+0.015*(tA-P.app)+0.2*gauss(),3,97);P.aS*=0.996;
 if(P.lost)return;
 if(P.meet&&S.day>P.meet.dl)leadRate(S,0,0,true);
 if(P.dil&&S.day>P.dil.dl)leadChoose(S,P.dil.def,true);
 if(P.bubble&&S.day>=P.bubble){P.bubble=null;fire(S,{id:'housing_crash',go(S2,x){x.dem(c,-1.1);x.conf(c,-7);domCo(S,c,'bank','reit','build').forEach(o=>{o.idioT*=0.9;o.idioM*=0.9;o.sent-=0.06;});x.add(`Banques, foncières et construction ${c.de} : bénéfices −10 %`,c.id,-1);x.cs(0.2);x.app(-6);
  return GN(c,3,`${c.name} : la bulle immobilière éclate`,`Les prix des logements chutent de 15 %. Les ménages endettés réduisent leurs dépenses, les banques provisionnent des pertes et la construction s’effondre.`,'Immobilier');}},'sim');}
 if(!P.dil&&S.day>=P.nextDil){const el=DIL.filter(d=>(P.done[d.id]||-1e9)<S.day-150&&(!d.ok||d.ok(S,c,P)));if(el.length)openDil(S,pick(el).id);P.nextDil=S.day+22+Math.floor(rnd()*28);}
 if(S.day>=P.nextEl)election(S);
}

const DIPK={summit:{lab:'Sommet de détente',cd:60},ally:{lab:'Proposer une alliance',cd:120},sanc:{lab:'Sanctions',cd:60},lift:{lab:'Lever les sanctions',cd:40},break:{lab:'Rompre l’alliance',cd:120}};
function dipOk(S,kind,oid){const P=S.P;if(!P||P.lost||!S.G)return false;const c=S.C[P.cid],o=S.C[oid];if(!o||o===c)return false;if((P.cool[kind+':'+oid]||0)>S.day)return false;const t=tOf(S,c.id,o.id),w=atWar(S,c.id,o.id);
 if(kind==='summit')return t>20&&!w;if(kind==='ally')return !allied(S,c.id,o.id)&&!w&&!sanc(S,c.id,o.id);if(kind==='sanc')return !sanc(S,c.id,o.id)&&!allied(S,c.id,o.id);if(kind==='lift')return !!(S.G.sanc[pk(c.id,o.id)]&&S.G.sanc[pk(c.id,o.id)].by===c.id);if(kind==='break')return allied(S,c.id,o.id);return false;}
function leadDiplo(S,kind,oid){if(!dipOk(S,kind,oid))return null;const P=S.P,c=S.C[P.cid],o=S.C[oid];P.cool[kind+':'+oid]=S.day+DIPK[kind].cd;

  if(kind==='summit'){const ok=rnd()<clamp(1.1-t/90,0.25,0.95);if(ok){x.tension(c,o,-(8+8*rnd()));x.risk(0.01);x.app(1);return GN(c,2,`Sommet ${c.name}–${o.name} : les deux pays s’engagent à apaiser leurs relations`,`Vous avez rencontré les dirigeants ${o.de}. Retour des ambassadeurs et promesse de coopération commerciale.`,'Géopolitique');}

  if(kind==='ally'){const p=clamp(0.9-t/55+(c.size>=o.size?0.15:0)-0.12*alliesOf(S,o.id).length,0.05,0.9);
   if(rnd()<p){geoAlly(S,x,c,o);x.app(2);return GN(c,2,`${o.name} accepte l’alliance proposée par ${c.name}`,`Les deux pays réduisent leurs barrières commerciales et s’engagent à se défendre mutuellement.`,'Géopolitique');}
   if(rnd()<0.4){S.G.pendP={id:'counter',arg:o.id};x.add(`${o.name} prépare une contre-offre`);return GN(c,1,`${o.name} hésite à s’allier avec ${c.name} et prépare ses conditions`,`Le gouvernement ${o.de} n’a pas dit non : une contre-offre est attendue.`,'Géopolitique');}
   x.tension(c,o,4);return GN(c,1,`${o.name} refuse l’alliance proposée par ${c.name}`,`Le refus est poli mais ferme. Relation actuelle : ${relLab(S,c.id,o.id).toLowerCase()}.`,'Géopolitique');}
  if(kind==='sanc'){geoSanction(S,x,c,o);x.app(t>60?3:-1);return GN(c,3,`${c.name} impose des sanctions économiques à ${o.name}`,`Gel d’avoirs et restrictions d’exportation. Les entreprises ${o.de} sont pénalisées, mais vos exportateurs perdent aussi un débouché.`,'Géopolitique');}

  return null;}},'user');}

/* ================= ANALYSE ================= */
const mean=a=>a.reduce((x,y)=>x+y,0)/(a.length||1);
function std(a){if(a.length<2)return NaN;const m=mean(a);return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1));}
function lrets(a){const r=[];for(let i=1;i<a.length;i++)r.push(Math.log(a[i]/a[i-1]));return r;}
function srets(a){const r=[];for(let i=1;i<a.length;i++)r.push(a[i]/a[i-1]-1);return r;}
function corrOf(a,b){const n=Math.min(a.length,b.length);if(n<5)return NaN;a=a.slice(-n);b=b.slice(-n);const ma=mean(a),mb=mean(b);let c=0,va=0,vb=0;for(let i=0;i<n;i++){c+=(a[i]-ma)*(b[i]-mb);va+=(a[i]-ma)**2;vb+=(b[i]-mb)**2;}return c/Math.sqrt(va*vb);}
function betaOf(ra,rm){const n=Math.min(ra.length,rm.length);if(n<5)return NaN;ra=ra.slice(-n);rm=rm.slice(-n);const a=mean(ra),b=mean(rm);let c=0,v=0;for(let i=0;i<n;i++){c+=(ra[i]-a)*(rm[i]-b);v+=(rm[i]-b)**2;}return c/v;}
function maxDD(a){let pk=a[0],dd=0;for(const v of a){if(v>pk)pk=v;dd=Math.min(dd,v/pk-1);}return dd;}
function quant(a,q){const s=[...a].sort((x,y)=>x-y);return s[Math.floor(q*(s.length-1))];}
function histBase(id,n){const I=inst(id);if(!I)return [];const c=S.C[I.cid];const L=Math.min(n,I.h.length,c.h.fx.length);const out=[];for(let i=L;i>0;i--){out.push(I.h[I.h.length-i]/c.h.fx[c.h.fx.length-i]);}return out;}
function riskOf(arr){const r=lrets(arr);return {vol:std(r)*Math.sqrt(252),dd:maxDD(arr)};}
function ttmOf(o){const q=o.q.slice(-4);if(q.length<4)return null;const s=k=>q.reduce((a,x)=>a+x[k],0);return {rev:s('rev'),op:s('op'),ni:s('ni'),eps:s('eps'),da:s('da')};}
function portStats(){
 const eq=A.eq,n=eq.length,B=BASE(S);if(n<3)return null;
 const r=srets(eq),tot=eq[n-1]/A.start-1,ann=Math.pow(1+tot,252/Math.max(1,n-1))-1,vol=std(r)*Math.sqrt(252),rf=B.i/100;
 const gm=srets(S.W.h.gidx.slice(-n));const beta=betaOf(r,gm);
 const ids=Object.keys(A.pos);let pnl=null;
 if(ids.length){const L=Math.min(250,S.dates.length);const series=ids.map(id=>{const h=histBase(id,L),p=A.pos[id],I=inst(id),v=p.q*I.px*fxr(I.cid);return srets(h).map(x=>x*v);});const m=Math.min(...series.map(s=>s.length));pnl=[];for(let t=0;t<m;t++)pnl.push(series.reduce((a,s)=>a+s[s.length-m+t],0));}
 let var95=NaN,es=NaN,pvar=NaN;if(pnl&&pnl.length>20){var95=-quant(pnl,0.05);const tail=pnl.filter(x=>x<=-var95);es=-mean(tail);pvar=1.645*std(pnl);}
 return {tot,ann,vol,sharpe:(ann-rf)/vol,dd:maxDD(eq),beta,var95,es,pvar,n};
}

 if(typeof x==='object'){for(const k of Object.keys(x)){if(SAFE_BAD.has(k)||k.length>200){delete x[k];continue;}x[k]=safeClean(x[k],d+1);}return x;}return null;}

function offInit(){const C=carInit();if(!C.off)C.off={bal:0,ev:0,since:null,hist:[]};return C.off;}
function auditP(){const C=carInit(),O=offInit(),c=curRes();if(O.bal<=0&&O.ev<=0)return 0;return clamp((ENF[c.role]??0.05)*(1+Math.log10(1+O.bal/2e5)),0,0.5);}
function offMove(amt){const C=carInit(),O=offInit();amt=+amt;if(!amt)return 'Montant invalide.';
 if(amt>0){const free=equity()-C.reg.free.bal-C.reg.ret.bal-O.bal;if(amt>free)return 'Le montant dépasse la part de votre portefeuille non abritée.';const fee=Math.max(500,amt*HAVEN.open);A.cash-=fee;A.fees+=fee;O.bal+=amt;if(!O.since)O.since=S.date;O.hist.unshift({d:S.date,t:`Dépôt de ${f(amt,0)} ${BC()} (frais ${f(fee,0)})`});return null;}
 const w=Math.min(-amt,O.bal);O.bal-=w;O.hist.unshift({d:S.date,t:`Rapatriement de ${f(w,0)} ${BC()}`});return null;}
