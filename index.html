function recentLabel(s){const [a,b]=s.split(/\s+/);const o=coBy(a);if(o)return `${a} — ${o.n}${b?' · '+({DES:'fiche',GP:'graphique',FA:'états financiers',DCF:'modèle DCF',COMP:'comparables'}[b]||b):''}`;const k=FKEYS.find(z=>z[0]===a);if(k)return `${a} — ${k[1]}${b?' '+b:''}`;if(S.K[a])return `${a} — ${S.K[a].name}`;return s;}
/* plan du terminal (aide) */
function planHTML(){return `<div class="plan">${FGROUPS.map(g=>`<div class="box"><h4>${g.n}</h4><div class="in">${g.fn.map(([c,n])=>`<button class="pitem" data-go="${c}"><b>${c}</b><span><i>${n}</i>${esc(FDESC[c]||'')}</span></button>`).join('')}</div></div>`).join('')}
 <div class="box"><h4>Entreprise (tapez le code d’un titre)</h4><div class="in">${[['DES','Fiche : chiffres clés, fondateur, dirigeants, écart au juste prix'],['GP','Graphique du cours, comparaison, vos achats'],['FA','États financiers'],['DCF','Modèle d’actualisation des flux'],['COMP','Comparables du secteur']].map(([c,d])=>`<button class="pitem" data-go="${focusT()} ${c}"><b>${c}</b><span><i>${focusT()} ${c}</i>${d}</span></button>`).join('')}</div></div></div>`;}
const FN_LIST=['CARR','IMPOT','WEI','TOP','MON','ECST','PAYS','GEO','RICH','RECO','IPO','REP','METEO','WIRP','GC','FXC','CMDTY','EQS','SECT','MOST','SENT','FLUX','ECO','EVTS','PORT','WL','CORR','HELP','DCF','COMP'];
renderFkeys();renderPresets();
function fillDatalist(){}
function parseCmd(str){
 const t=str.toUpperCase().replace(/<GO>|EQUITY|\bGO\b/g,' ').trim().split(/\s+/).filter(Boolean);if(!t.length)return {err:''};
 const [a,b,c]=t;
 if(a==='BACK')return {back:true};
 if(a==='SIM'||a==='NEW')return {sec:'sim'};
 if(a==='GOV'||a==='LEAD')return {sec:'lead'};
 if(a==='WS'){return {ws:b,name:t.slice(2).join(' ')};}
 if(a==='BUY'||a==='TRADE')return {trade:b};
 if(a==='TOP'&&b&&S.C[b])return {v:{fn:'TOP',arg:null,nf:b}};
 if(FN_LIST.includes(a)){if((a==='DCF'||a==='COMP')&&!coBy(b))return {err:`${a} attend un titre, par exemple ${a} ${S.co[0].t}.`};return {v:{fn:a,arg:b||null}};}
 if(coBy(a)){if(b==='DCF'||b==='COMP')return {v:{fn:b,arg:a}};return {v:{fn:'SEC',arg:a,tab:['DES','GP','FA'].includes(b)?b:'DES'}};}
 if(S.K[a])return {v:{fn:'CMDTY',arg:a}};
 if(S.C[a])return {v:{fn:'ECST',arg:a}};
 if(/^[A-Z]{3}10A$/.test(a)&&S.C[a.slice(0,3)])return {v:{fn:'GC',arg:null}};
 const cc=S.cids.map(i=>S.C[i]).find(x=>x.cur===a);if(cc)return {v:{fn:'FXC',arg:null}};
 return {err:`Commande inconnue : « ${str} ». Tapez HELP pour la liste.`};
}
function runCmd(str,pi){
 if(pi===undefined)pi=UI.ws.act;
 const r=parseCmd(str);const pe=document.querySelector(`[data-perr="${pi}"]`);if(pe)pe.textContent=r.err||'';
 if(r.err!==undefined)return;
 if(r.sec){setSec(r.sec);return;}
 if(r.trade!==undefined){if(r.trade&&inst(r.trade)){UI.sel=r.trade;UI.btab=inst(r.trade).type;}setSec('broker');return;}
 if(r.ws){wsCmd(r.ws,r.name);return;}
 let v=r.v;
 if(r.back){if(UI.ph[pi].length<2)return;UI.ph[pi].pop();v=UI.ph[pi].pop();if(!v)return;}else noteRecent(str);
 UI.ws.p[pi]=v;UI.ph[pi].push(v);if(UI.ph[pi].length>30)UI.ph[pi].shift();
 UI.ws.act=pi;if(UI.sec!=='term')setSec('term');
 const inp=document.querySelector(`[data-pinput="${pi}"]`);if(inp)inp.value='';
 markAct();renderPanel(pi,true);save();
}
function wsCmd(op,name){
 op=op.toUpperCase();
 if(op==='SAVE'&&name){UI.wsSaved[name]=JSON.parse(JSON.stringify(UI.ws));toast(`Espace « ${name} » enregistré.`);fillWS();save();}
 else if(op==='LOAD'&&UI.wsSaved[name]){UI.ws=JSON.parse(JSON.stringify(UI.wsSaved[name]));buildWS();save();}
 else if(op==='DEL'&&UI.wsSaved[name]){delete UI.wsSaved[name];fillWS();save();}
 else toast('Syntaxe : WS SAVE nom · WS LOAD nom · WS DEL nom');
}

/* ================= TERMINAL : ESPACE DE TRAVAIL ================= */
const ROWS={1:[[0]],2:[[0,1]],3:[[0,1,2]],4:[[0,1],[2,3]]};
function rowW(r){const k=UI.ws.lay+'-'+r,n=ROWS[UI.ws.lay][r].length;let w=UI.ws.w[k];if(!w||w.length!==n)w=UI.ws.w[k]=Array(n).fill(1/n);return w;}
function rowH(r){const k=UI.ws.lay+'-'+r;return UI.ws.h[k]||(UI.ws.lay===4?440:Math.max(480,Math.round(window.innerHeight*0.74)));}
function buildWS(){
 const rows=ROWS[UI.ws.lay];
 $('ws').innerHTML=rows.map((row,r)=>{const w=rowW(r);return `<div class="wrow" data-row="${r}" style="height:${rowH(r)}px">${row.map((pi,j)=>`${j?`<div class="vsplit" data-vs="${r}:${j}" role="separator" aria-label="Redimensionner"></div>`:''}<section class="pane" data-p="${pi}" style="flex:0 0 calc(${(w[j]*100).toFixed(3)}% - ${(row.length-1)*6/row.length}px)">
  <form class="pcmd" data-pform="${pi}" autocomplete="off"><button type="button" class="pback" data-pback="${pi}" title="Écran précédent" aria-label="Écran précédent du panneau ${pi+1}">◀</button><span class="pn">${pi+1}</span><input data-pinput="${pi}" placeholder="${UI.ws.p[pi].fn}${UI.ws.p[pi].arg?' '+UI.ws.p[pi].arg:''} — tapez une commande" aria-label="Commande du panneau ${pi+1}"><button type="submit">GO</button></form><div class="perr" data-perr="${pi}"></div>
  <div class="pbody" id="pb${pi}"></div></section>`).join('')}</div><div class="hsplit" data-hs="${r}" role="separator" aria-label="Redimensionner la hauteur"></div>`;}).join('');
 document.querySelectorAll('[data-lay]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.lay===UI.ws.lay));
 if(UI.ws.act>=ROWS[UI.ws.lay].flat().length)UI.ws.act=0;
 markAct();renderTerm(true);
}
function markAct(){setTimeout(markFkeys,0);document.querySelectorAll('.pane[data-p]').forEach(p=>p.classList.toggle('act',+p.dataset.p===UI.ws.act));}
function fillWS(){const names=Object.keys(UI.wsSaved);$('wssel').innerHTML=`<option value="">Espaces enregistrés (${names.length})</option>`+names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');}
document.addEventListener('submit',e=>{const f_=e.target.closest('[data-pform]');if(f_){e.preventDefault();const pi=+f_.dataset.pform;runCmd(f_.querySelector('input').value,pi);}});
document.addEventListener('focusin',e=>{const p=e.target.closest&&e.target.closest('.pane[data-p]');if(p&&+p.dataset.p!==UI.ws.act){UI.ws.act=+p.dataset.p;markAct();}});
let drag=null;
document.addEventListener('pointerdown',e=>{
 const vs=e.target.closest('[data-vs]'),hs=e.target.closest('[data-hs]');
 if(vs){const [r,j]=vs.dataset.vs.split(':').map(Number);const row=vs.parentElement;drag={t:'v',r,j,x0:e.clientX,w0:[...rowW(r)],W:row.clientWidth};vs.setPointerCapture(e.pointerId);e.preventDefault();}
 else if(hs){const r=+hs.dataset.hs;drag={t:'h',r,y0:e.clientY,h0:rowH(r)};hs.setPointerCapture(e.pointerId);e.preventDefault();}
});
document.addEventListener('pointermove',e=>{if(!drag)return;
 if(drag.t==='v'){const d=(e.clientX-drag.x0)/drag.W,w=[...drag.w0],a=drag.j-1,b=drag.j;let na=w[a]+d,nb=w[b]-d;if(na<0.15||nb<0.15)return;w[a]=na;w[b]=nb;UI.ws.w[UI.ws.lay+'-'+drag.r]=w;
  const row=document.querySelector(`.wrow[data-row="${drag.r}"]`);const n=w.length;row.querySelectorAll('.pane').forEach((p,i)=>p.style.flex=`0 0 calc(${(w[i]*100).toFixed(3)}% - ${(n-1)*6/n}px)`);}
 else{const h=clamp(drag.h0+(e.clientY-drag.y0),200,1600);UI.ws.h[UI.ws.lay+'-'+drag.r]=h;document.querySelector(`.wrow[data-row="${drag.r}"]`).style.height=h+'px';}
});
document.addEventListener('pointerup',()=>{if(drag){drag=null;dirty=true;save();}});
$('wssave').addEventListener('click',()=>{const n=$('wsname').value.trim();if(!n){toast('Donnez un nom à l’espace de travail.');return;}wsCmd('SAVE',n);$('wsname').value='';});
$('wssel').addEventListener('change',e=>{if(e.target.value)wsCmd('LOAD',e.target.value);e.target.value='';});

const go=(cmd,inner,cl='')=>{const hd=heldIn(cmd);if(hd){inner=inner.replace('</td>',ownTag(hd)+'</td>');cl+=' ownrow';}return `<tr data-go="${cmd}" tabindex="0" class="${cl}">${inner}</tr>`;};
function linkCmd(id){if(id==='MONDE')return 'WEI';if(id.startsWith('SEC:'))return 'SECT';if(id.startsWith('Y'))return 'GC';if(coBy(id))return id+' DES';if(S.K[id])return 'CMDTY '+id;if(S.C[id])return 'ECST '+id;if(/10A$/.test(id))return 'GC';return 'FXC';}

function diag(c){
 const out=[];const rr_=c.i-c.pie,K=S.K;
 out.push(c.pi>c.piT+0.5?`L’inflation (${f(c.pi,1)} %) dépasse la cible de ${f(c.piT,1)} % de la ${c.cbS}.`:c.pi<c.piT-0.5?`L’inflation (${f(c.pi,1)} %) est sous la cible de ${f(c.piT,1)} %.`:`L’inflation (${f(c.pi,1)} %) est proche de la cible de ${f(c.piT,1)} %.`);
 const st=rr_-c.rStar;
 out.push(`Le taux réel (${f(rr_,2)} %) est ${st>0.6?'nettement au-dessus':st<-0.6?'nettement en dessous':'proche'} du taux neutre estimé (${f(c.rStar,1)} %) : la politique monétaire est ${st>0.6?'restrictive et freine la demande':st<-0.6?'accommodante et stimule la demande':'à peu près neutre'}.`);
 out.push(c.gap>0.5?`L’économie tourne au-dessus de son potentiel (écart de production ${sg(c.gap,1)} %), ce qui alimente l’inflation.`:c.gap<-0.5?`L’économie tourne sous son potentiel (écart de production ${sg(c.gap,1)} %), ce qui modère l’inflation et pèse sur l’emploi.`:`L’économie tourne près de son potentiel.`);
 out.push(`Confiance des ménages : ${f(c.conf,1)} (100 = normale). Balance commerciale : ${sg(c.tb,1)} % du PIB.`);
 const lo=K.OIL.p/K.OIL.p0-1;
 if(Math.abs(lo)>0.08){if(c.oil>0.3)out.push(`Le brut à ${f(K.OIL.p,2)} ${BC()} (${pc(lo,0)} par rapport à sa référence) ${lo>0?'gonfle':'réduit'} les recettes d’exportation.`);else if(c.oil<-0.3)out.push(`Le brut (${pc(lo,0)}) ${lo>0?'pèse sur le pouvoir d’achat et ajoute à l’inflation importée':'soulage les ménages et les entreprises'}.`);}
 const e=expMove(c),nd=nextDue(c.cbOff,32);

 const rm=t.closest('[data-regmax]');if(rm){const k=rm.dataset.regmax,C=carInit(),amt=Math.max(0,Math.min(C.reg[k].room,equity()-C.reg.free.bal-C.reg.ret.bal));const err=amt>0?regMove(k,Math.floor(amt)):'Aucun droit de cotisation disponible.';toast(err||`Cotisation de ${f(Math.floor(amt),0)} ${BC()} enregistrée.`);if(!err){save();dirty=true;render();}return;}
 const of=t.closest('[data-off]');if(of){const amt=(+(($('offAmt')||{}).value)||0)*(+of.dataset.off);const err=offMove(amt);toast(err||(amt>0?`${f(amt,0)} ${BC()} placés à ${HAVEN.sh}.`:`${f(-amt,0)} ${BC()} rapatriés.`));if(!err){save();dirty=true;render();}return;}
 if(t.closest('[data-offam]')){toast(offAmnesty());save();dirty=true;render();return;}
 const pr=t.closest('[data-preset]');if(pr){applyPreset(+pr.dataset.preset);return;}
 const pbk=t.closest('[data-pback]');if(pbk){runCmd('BACK',+pbk.dataset.pback);return;}
 const gg=t.closest('[data-go]');if(gg){const p=gg.closest('.pane');runCmd(gg.dataset.go,p?+p.dataset.p:undefined);return;}
 const wls=t.closest('[data-wlsel]');if(wls){UI.wl.cur=wls.dataset.wlsel;const p=wls.closest('.pane');if(p){UI.ws.p[+p.dataset.p].arg=wls.dataset.wlsel;renderPanel(+p.dataset.p,true);}save();return;}
 const wlr=t.closest('[data-wlrm]');if(wlr){const [n,id]=wlr.dataset.wlrm.split('|');UI.wl.lists[n]=UI.wl.lists[n].filter(x=>x!==id);save();const p=wlr.closest('.pane');if(p)renderPanel(+p.dataset.p,true);return;}
 const wld=t.closest('[data-wldel]');if(wld){delete UI.wl.lists[wld.dataset.wldel];UI.wl.cur='Principale';cleanWL();save();const p=wld.closest('.pane');if(p){UI.ws.p[+p.dataset.p].arg=null;renderPanel(+p.dataset.p,true);}return;}
 const dr=t.closest('[data-dcfreset]');if(dr){delete UI.dcf[dr.dataset.dcfreset];const p=dr.closest('.pane');if(p)renderPanel(+p.dataset.p,true);save();return;}
 const bt=t.closest('[data-btab]');if(bt){UI.btab=bt.dataset.btab;UI.bq='';$('bsearch').value='';renderBroker();return;}
 const sl=t.closest('[data-sel]');if(sl){UI.sel=sl.dataset.sel;const I=inst(UI.sel);$('opx').value=+I.px.toFixed(pd(I.px));$('omsg').textContent='';renderBroker();return;}
 const sd=t.closest('[data-side]');if(sd){UI.side=+sd.dataset.side;renderBroker();return;}
 const cx=t.closest('[data-cancel]');if(cx){A.ord=A.ord.filter(o=>o.n!==+cx.dataset.cancel);save();renderBroker();return;}
 const ra=t.closest('[data-rate]');if(ra){const [c,x]=ra.dataset.rate.split(':');userRate(S,c,+x);save();dirty=true;toast(`${S.C[c].cbS} : ${sg(+x*100,0)} pb. Effets à la prochaine séance (voir EVTS).`);return;}
 const ev=t.closest('[data-ev]');if(ev){const E=userEvent(S,ev.dataset.ev);if(E){save();dirty=true;toast('Événement déclenché : '+E.title);}else toast('Conditions non réunies pour cet événement.');return;}
 const cr=t.closest('[data-crisis]');if(cr){const E=userCrisis(S,cr.dataset.crisis);if(E){save();dirty=true;toast('Crise déclenchée : '+E.title);}return;}
 const ac=t.closest('[data-act]');if(ac){simAct(ac.dataset.act);return;}
});
document.addEventListener('submit',e=>{
 if(e.target.closest&&e.target.closest('[data-gmform]')){e.preventDefault();const nm=$('gmName').value.trim();slotSave(nm,null).then(ok=>{if(ok){toast(`Partie « ${nm||'sans nom'} » sauvegardée.`);renderGm();}});return;}
 const a=e.target.closest('[data-wladd]');if(a){e.preventDefault();const n=a.dataset.wladd,id=a.querySelector('input').value.trim().toUpperCase();if(inst(id)){if(!UI.wl.lists[n].includes(id))UI.wl.lists[n].push(id);save();}else toast(`« ${id} » est introuvable.`);const p=a.closest('.pane');a.querySelector('input').blur();if(p)renderPanel(+p.dataset.p,true);return;}
 const nl=e.target.closest('[data-wlnew]');if(nl){e.preventDefault();const n=nl.querySelector('input').value.trim();if(n&&!UI.wl.lists[n]){UI.wl.lists[n]=[];UI.wl.cur=n;save();}const p=nl.closest('.pane');nl.querySelector('input').blur();if(p){UI.ws.p[+p.dataset.p].arg=n;renderPanel(+p.dataset.p,true);}}
});
document.addEventListener('keydown',e=>{
 const tg=e.target,typing=/INPUT|SELECT|TEXTAREA/.test(tg.tagName);
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('us').focus();return;}
 if(!typing&&e.key==='/'){e.preventDefault();$('us').focus();return;}
 if(e.altKey&&/^[1-4]$/.test(e.key)){const i=+e.key-1;if(ROWS[UI.ws.lay].flat().includes(i)){if(UI.sec!=='term')setSec('term');UI.ws.act=i;markAct();const inp=document.querySelector(`[data-pinput="${i}"]`);if(inp)inp.focus();e.preventDefault();}return;}
 if(e.altKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){const ps=ROWS[UI.ws.lay].flat();let j=ps.indexOf(UI.ws.act)+(e.key==='ArrowRight'?1:-1);j=(j+ps.length)%ps.length;UI.ws.act=ps[j];markAct();const inp=document.querySelector(`[data-pinput="${ps[j]}"]`);if(inp)inp.focus();e.preventDefault();return;}
 if(e.key==='Escape'&&S.Q&&S.Q.dil&&!$('cdlg').hidden){UI.cdlgHide=S.Q.dil.day+S.Q.dil.id;renderCdlg();return;}
 if(e.key==='Escape'&&UI.gmOpen){UI.gmOpen=false;renderGm();return;}
 if(e.key==='Escape'&&UI.wkOpen){UI.wkOpen=false;renderWk();return;}
 if(e.key==='Escape'&&typing){tg.blur();return;}
 if(typing)return;
 if(e.key===' '){e.preventDefault();setSpeed(UI.speed?0:(UI.prevSpeed||1));return;}
 if(e.key==='+'||e.key==='='){setSpeed(Math.min(4,UI.speed+1));return;}
 if(e.key==='-'){setSpeed(Math.max(0,UI.speed-1));return;}
 if(e.key==='?'){runCmd('HELP');return;}
 if(e.key==='Enter'){const g=tg.closest&&tg.closest('[data-go],[data-news]');if(g){g.click();e.preventDefault();}}
});
window.addEventListener('resize',()=>{dirty=true;});
document.addEventListener('pointermove',e=>{if(drag)return;const c=e.target.closest&&e.target.closest('canvas.ch');if(!c||!c.id||!c._o)return;const r=c.getBoundingClientRect();UI.hov={id:c.id,x:e.clientX-r.left,y:e.clientY-r.top};drawChart(c,c._o);});
document.addEventListener('pointerout',e=>{const c=e.target.closest&&e.target.closest('canvas.ch');if(!c||(e.relatedTarget&&c.contains(e.relatedTarget)))return;if(UI.hov&&UI.hov.id===c.id){UI.hov=null;if(c._o)drawChart(c,c._o);}});
document.fonts&&document.fonts.ready.then(()=>{dirty=true;});
fillWS();buildWS();
$('terminal').hidden=UI.sec!=='term';$('broker').hidden=UI.sec!=='broker';$('sim').hidden=UI.sec!=='sim';
if(UI.sec==='sim')renderSim(true);
$('lead').hidden=UI.sec!=='lead';$('ctry').hidden=UI.sec!=='ctry';if(UI.sec==='lead')renderLead(true);UI.dlgSeen=leadKey();
$('ceo').hidden=UI.sec!=='ceo';if(UI.sec==='ceo')renderCeo(true);
render();schedule();requestAnimationFrame(loop);
if(!BOOT_LOADED)idbGet('autosave').then(r=>{if(r){try{applyState(JSON.parse(r,unpackR));toast('Partie en cours restaurée.');}catch(e){}}}).catch(()=>{});
slotsLoad().catch(()=>{});
</script>

</html>
